<script>
"use strict";
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const CATS = [
  {id:'unhas',label:'Unhas',emoji:'💅'},{id:'cabelo',label:'Cabelo',emoji:'💇‍♀️'},
  {id:'sobrancelha',label:'Sobrancelhas',emoji:'✨'},{id:'maquiagem',label:'Maquiagem',emoji:'💄'},
  {id:'estetica',label:'Estética',emoji:'🧖‍♀️'},{id:'barbearia',label:'Barbearia',emoji:'💈'},
  {id:'tattoo',label:'Tattoo & Piercing',emoji:'🖋️'},{id:'odonto',label:'Odontologia',emoji:'🦷'},
  {id:'petshop',label:'Pet Shop',emoji:'🐾'}
];
/* Categorias do nicho — o app NÃO mostra categorias de outros nichos */
const CATS_BY_NICHE = {
  salao: ['unhas','cabelo','sobrancelha','maquiagem','estetica'],
  barbearia: ['barbearia','cabelo','sobrancelha'],
  unhas: ['unhas'],
  estetica: ['estetica'],
  maquiagem: ['maquiagem'],
  tattoo: ['tattoo'],
  sobrancelha: ['sobrancelha'],
  odonto: ['odonto'],
  petshop: ['petshop']
};
function allSalonCats(){
  const niche = currentNiche();
  const prefer = (CATS_BY_NICHE[niche] || CATS_BY_NICHE.salao).slice();
  const custom = ((S.salon && S.salon.cfg && S.salon.cfg.customCategories) || []);
  const map = {};
  prefer.forEach(id => {
    const b = CATS.find(c=>c.id===id) || {id, label:id, emoji:'✨'};
    let item = Object.assign({photo:null, builtin:true}, b);
    if(niche==='barbearia' && id==='cabelo') item = Object.assign({}, item, {emoji:'💇‍♂️', label:'Cabelo / Corte'});
    if(niche==='barbearia' && id==='sobrancelha') item = Object.assign({}, item, {emoji:'👁️', label:'Sobrancelha'});
    map[id] = item;
  });
  custom.forEach(c => {
    if(!c || !c.id) return;
    map[c.id] = { id:c.id, label:c.label||c.id, emoji:c.emoji||'✨', photo:c.photo||null, builtin:false };
  });
  (S.services||[]).forEach(s => {
    if(!s || !s.cat || map[s.cat]) return;
    const b = CATS.find(c=>c.id===s.cat);
    map[s.cat] = b ? Object.assign({photo:null, builtin:true}, b) : {id:s.cat, label:s.cat, emoji:'✨', photo:null, builtin:false};
  });
  return Object.values(map);
}
function catsForEditor(showAll){
  if(showAll){
    const all = CATS.map(c => Object.assign({photo:null, builtin:true}, c));
    getCustomCategories().forEach(c => { if(c && c.id && !all.some(x=>x.id===c.id)) all.push({id:c.id,label:c.label,emoji:c.emoji||'✨',photo:c.photo||null,builtin:false}); });
    return all;
  }
  return allSalonCats();
}
function catsForPublic(){
  const all = allSalonCats();
  const usedIds = [];
  (S.services||[]).forEach(s => { if(s && s.cat && !usedIds.includes(s.cat)) usedIds.push(s.cat); });
  if(!usedIds.length) return all.filter(c => (CATS_BY_NICHE[currentNiche()]||[]).includes(c.id) || !c.builtin);
  return usedIds.map(id => all.find(c=>c.id===id) || catDisplay(id));
}
function catsForForm(){
  const list = catsForEditor(false).slice();
  const cur = S.editing && S.editing.cat;
  if(cur && !list.some(c=>c.id===cur)) list.push(catDisplay(cur));
  return list;
}
function catLabel(id){
  const c = catDisplay(id);
  return c ? c.label : (id || 'Outros');
}
function catDisplay(id){
  const found = allSalonCats().find(x=>x.id===id);
  if(found) return found;
  const c = CATS.find(x=>x.id===id);
  if(c) return Object.assign({photo:null, builtin:true}, c);
  return {id:id||'outros', label:id||'Outros', emoji:'✨', photo:null, builtin:false};
}
function catIconHTML(c, cls){
  const cl = cls || 'em';
  return `<div class="${cl}">${vitCatIcon(c && c.id)}</div>`;
}
function proAvatarHTML(p, cls){
  const cl = cls || 'av';
  if(p && p.photo) return `<span class="${cl}"><img src="${p.photo}" alt=""></span>`;
  const letter = String((p && p.name) || '?').charAt(0).toUpperCase();
  return `<span class="${cl} av-letter">${esc(letter)}</span>`;
}
function fileToJpegDataUrl(file, maxSide, quality){
  return new Promise((resolve, reject) => {
    if(!file || !String(file.type||'').startsWith('image/')){ reject(new Error('Envie uma imagem')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Erro ao ler imagem'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('Imagem inválida'));
      img.onload = () => {
        try{
          const side = maxSide || 600;
          const scale = Math.min(1, side / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
          const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          resolve(cv.toDataURL('image/jpeg', quality || 0.8));
        }catch(err){ reject(new Error('Não foi possível processar a imagem')); }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

  maquiagem: ['💄','✨','🪞','👰','🎨','💖','👑','🌸','💫','🎀','🩷','🌟'],
  tattoo: ['🖋️','✨','🖤','🔥','💪','📋','👑','🌟','🪞','💈'],
  sobrancelha: ['✨','👁️','🌿','💫','🪞','👑','💖','🌸','🧴'],
  odonto: ['🦷','🪥','✨','💧','📋','💙','🌟','🪞','🧴'],
  petshop: ['🐾','🐶','🐱','✂️','✨','💖','🧴','🌟','💧','🛁']

function isValidCpf(cpf){

  if(/^(\d)\1{10}$/.test(d)) return false;
  let sum=0; for(let i=0;i<9;i++) sum+=(+d[i])*(10-i);

function mixColor(a,b,w){ const ca=hexRgb(a), cb=hexRgb(b); const c={r:Math.round(ca.r*(1-w)+cb.r*w),g:Math.round(ca.g*(1-w)+cb.g*w),b:Math.round(ca.b*(1-w)+cb.b*w)}; return '#'+((1<<24)+(c.r<<16)+(c.g<<8)+c.b).toString(16).slice(1); }
function lumOf(h){ const c=hexRgb(h); return (0.299*c.r+0.587*c.g+0.114*c.b)/255; }
function alphaOf(h,a){ const c=hexRgb(h); return 'rgba('+c.r+','+c.g+','+c.b+','+a+')'; }
function srgbLin(v){ v=v/255; return v<=0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
function relLum(h){ const c=hexRgb(h); return 0.2126*srgbLin(c.r)+0.7152*srgbLin(c.g)+0.0722*srgbLin(c.b); }
function contrastRatio(a,b){ const L1=relLum(a), L2=relLum(b); const hi=Math.max(L1,L2), lo=Math.min(L1,L2); return (hi+0.05)/(lo+0.05); }
function bestInk(bg){ return contrastRatio('#FFFFFF', bg) >= contrastRatio('#14110E', bg) ? '#FFFFFF' : '#14110E'; }
function bumpOnAll(fg, bgs, min){
  min = min || 4.6;
  bgs = (bgs || []).filter(Boolean);
  if(!bgs.length) return fg;
  if(bgs.every(bg => contrastRatio(fg, bg) >= min)) return fg;
  for(let w=0.08; w<=1.001; w+=0.07){
    const light = mixColor(fg, '#FFFFFF', w);
    const darkc = mixColor(fg, '#14110E', w);
    if(bgs.every(bg => contrastRatio(light, bg) >= min)) return light;
    if(bgs.every(bg => contrastRatio(darkc, bg) >= min)) return darkc;
  }
  return bestInk(bgs[0]);
}
function curTheme(){
  const t = (S.salon && S.salon.cfg && S.salon.cfg.theme) || THEME_DEFAULT;
  return { primary: /^#[0-9a-fA-F]{6}$/.test(t.primary||'') ? t.primary : THEME_DEFAULT.primary, bg: /^#[0-9a-fA-F]{6}$/.test(t.bg||'') ? t.bg : THEME_DEFAULT.bg, font: THEME_FONT_OPTS.some(f=>f.id===t.font) ? t.font : 'padrao' };
}
function tonePair(base, card, dark){
  let soft = dark ? mixColor(card, base, 0.48) : mixColor('#ffffff', base, 0.22);
  if(contrastRatio('#FFFFFF', soft) < 3.2 && contrastRatio('#14110E', soft) < 3.2){
    soft = dark ? mixColor(soft, '#000000', 0.42) : mixColor(soft, '#ffffff', 0.42);
  }
  return {soft: soft, fg: bestInk(soft)};
}
function applyTheme(){
  const th = curTheme();
  const primary = th.primary, bg = th.bg;
  const dark = lumOf(bg) < 0.45;
  const primaryLight = lumOf(primary) >= 0.55; /* dourado, amarelo, lima: não pintar caixa inteira */
  const card = dark ? mixColor(bg,'#ffffff',0.16) : '#ffffff';
  /* Superfície = cartão + um toque da cor. Nunca 70% de ouro (vira placa amarela ilegível). */
  const softAmt = dark ? (primaryLight ? 0.16 : 0.26) : (primaryLight ? 0.18 : 0.11);
  const faintAmt = dark ? (primaryLight ? 0.10 : 0.16) : (primaryLight ? 0.09 : 0.055);
  const soft = mixColor(card, primary, softAmt);
  const faint = mixColor(card, primary, faintAmt);
  const surfaces = [card, bg, faint, soft];
  const text = bumpOnAll(dark ? '#F8F4EE' : '#1A1410', surfaces, 7);
  const muted = bumpOnAll(dark ? '#E6DDD2' : '#3F3538', surfaces, 5.5);
  const line = dark ? alphaOf('#ffffff',0.28) : mixColor(bg, text, 0.80);
  const onSoft = bestInk(soft);
  const onFaint = bestInk(faint);
  const onPrimary = bestInk(primary);
  const accent = bumpOnAll(primary, [card, bg], 5.5);
  const price = bumpOnAll(primary, surfaces, 5.5);
  const grad = mixColor(primary, onPrimary === '#FFFFFF' ? '#ffffff' : '#000000', 0.14);
  const promoPrice = '#14110E';
  const promoPriceBg = '#FFFFFF';
  const g = tonePair('#1F8A4C', card, dark);
  const r = tonePair('#C62828', card, dark);
  const b = tonePair('#1E56A0', card, dark);
  const a = tonePair('#C49212', card, dark);
  const F = THEME_FONT_OPTS.find(f=>f.id===th.font) || THEME_FONT_OPTS[0];
  const css = ':root{'
    + '--pink:'+primary+';--pink-dark:'+accent+';--pink-soft:'+soft+';--pink-faint:'+faint+';'
    + '--pink-grad:'+grad+';--pink-contrast:'+onPrimary+';--price:'+price+';'
    + '--accent-text:'+accent+';--on-soft:'+onSoft+';--on-faint:'+onFaint+';'
    + '--promo-price:'+promoPrice+';--promo-price-bg:'+promoPriceBg+';'
    + '--green:'+g.fg+';--green-soft:'+g.soft+';--red:'+r.fg+';--red-soft:'+r.soft+';'
    + '--blue:'+b.fg+';--blue-soft:'+b.soft+';--amber:'+a.fg+';--amber-soft:'+a.soft+';'
    + '--bg:'+bg+';--bg-t:'+alphaOf(bg,0.92)+';--card:'+card+';'
    + '--dark:'+text+';--muted:'+muted+';--line:'+line+';'
    + '--font-body:'+F.body+';--font-heading:'+F.head+';'
    + '}';
  let st = document.querySelector('#themeStyle');
  if(!st){ st = document.createElement('style'); st.id='themeStyle'; st.setAttribute('id','themeStyle'); (document.head||document.documentElement).appendChild(st); }
  st.textContent = css;
  const mc = document.querySelector('meta[name="theme-color"]');
  if(mc) mc.setAttribute('content', primary);
  if(typeof drawBookingQr === 'function') drawBookingQr();
}

function togglePass(inputId, btn){
  const el = document.getElementById ? document.getElementById(inputId) : $('#'+inputId);
  if(!el) return;
  if(el.type === 'password'){ el.type = 'text'; if(btn) btn.textContent = '🙈'; }
  else { el.type = 'password'; if(btn) btn.textContent = '👁️'; }
}

      <p style="margin-top:6px;font-size:12.5px;line-height:1.7">Studio da Bel: <b>bel@studio.com</b> / <b>123456</b><br>Sala da Cíntia: <b>cintia@sala.com</b> / <b>123456</b><br>Unhas da Pri: <b>pri@unhas.com</b> / <b>123456</b></p></details>`);
  setTimeout(()=>{ const i=$('#lgEmail'); const p=$('#lgPass'); if(lastEmail && p) p.focus(); else if(i) i.focus(); },80);

async function doLogin(){
  const email = ($('#lgEmail').value||'').trim(), pass = $('#lgPass').value||'';
  if(!email || !pass){ toast('Digite e-mail e senha'); return; }
  try{
    const d = await api('/api/auth/login', {method:'POST', body: JSON.stringify({email, password: pass})});
    if(d.role==='admin'){ toast('Esse acesso é da administração'); return; }
    if(d.role==='pro' && !d.proId){ toast('Acesso de profissional inválido'); return; }
    S.token = d.token; S.slug = d.slug;
    localStorage.setItem('ba_token', S.token); localStorage.removeItem('glowp_token');
    try{ if(email) localStorage.setItem('ba_last_email', String(email).trim().toLowerCase()); }catch(e){}
    history.replaceState(null,'','/app?slug='+S.slug);
    await loadFull();
    S.clients = null; S.reports = null;
    S.mode = 'salao';
    closeModal();
    applyTheme();
    renderNav();
    showView('agenda');
    startEvents();
    toast('👋 Bem-vinda, '+(S.salon.name||'')+'!');
  }catch(e){ toast(e.message); }
}
async function logout(){
  stopEvents();
  S.token = null; S.isSalon = false; S.isPro = false; S.proId = null;
  localStorage.removeItem('ba_token'); localStorage.removeItem('glowp_token');
  S.mode = 'cliente';
  S.clients = null; S.reports = null; S.appointments = []; S.notifications = [];
  /* volta para o slug da URL atual (ou o que o usuário estava vendo) */
  try {
    const urlSlug = new URLSearchParams(location.search).get('slug') || S.requestedSlug || S.slug;
    S.slug = urlSlug;
    S.requestedSlug = urlSlug;
    if(S.slug) await loadPublic();
  } catch(e){}
  applyBrand(); applyTheme();
  renderNav(); showView('servicos');
  toast('Você saiu da área do salão');
}

function cleanServiceVideo(v){
  v = String(v || '').trim();
  if(!v) return '';
  v = v.replace(/^http:\/\//i, 'https://');
  if(/^www\./i.test(v) || /^(instagram|youtube|youtu\.be|tiktok)\./i.test(v)) v = 'https://' + v;
  if(!/^https:\/\//i.test(v)) return '';
  v = v.split('\n')[0].trim().slice(0, 400);
  if(/[\s<>"']/.test(v)) return '';
  return v;
}
function parseServiceVideo(raw){
  const u = cleanServiceVideo(raw);
  if(!u) return null;
  let m = u.match(/(?:youtube\.com\/watch\?(?:[^#]*&)?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/i);
  if(m){
    const id = m[1];
    return {
      kind:'youtube', id:id, href:u,
      src:'https://www.youtube.com/embed/'+id+'?autoplay=1&loop=1&rel=0&playlist='+id+'&playsinline=1',
      preview:'https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1&loop=1&controls=0&playsinline=1&rel=0&modestbranding=1&playlist='+id
    };
  }
  m = u.match(/instagram\.com\/(?:share\/)?(?:reel|reels|p|tv)\/([A-Za-z0-9_-]+)/i);
  if(m){
    const id = m[1];
    const path = /\/(?:reel|reels)\//i.test(u) ? 'reel' : 'p';
    const embed = 'https://www.instagram.com/'+path+'/'+id+'/embed';
    return { kind:'instagram', id:id, href:'https://www.instagram.com/'+path+'/'+id+'/', src:embed, preview:embed };
  }
  m = u.match(/tiktok\.com\/@[^/]+\/video\/(\d+)/i);
  if(m) return { kind:'tiktok', href:u };
  if(/\.(mp4|webm|ogg)(\?|#|$)/i.test(u)) return { kind:'file', href:u, src:u };
  return { kind:'link', href:u };
}

function svcMediaHTML(s){
  const clip = s && s.videoClip;
  const v = parseServiceVideo(s && s.video);

      ? `<iframe src="${esc(v.preview)}" allow="autoplay; encrypted-media; fullscreen" title="" tabindex="-1"></iframe>`

  modal(`<h3>🎬 ${title}</h3>${body}<div class="m-actions" style="margin-top:12px">${openBtn}<button class="btn ghost" onclick="closeModal();bookService('${s.id}')">Agendar este</button><button class="btn ghost" onclick="closeModal()">Fechar</button></div>`);

function renderCal(){
  const b = S.booking, y = S.calView.getFullYear(), m = S.calView.getMonth();
  const now = new Date();
  const canPrev = S.calView >= new Date(now.getFullYear(), now.getMonth(), 1);
  const canNext = S.calView < new Date(now.getFullYear(), now.getMonth()+3, 1);
  const firstDow = new Date(y,m,1).getDay(), dim = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1;d<=dim;d++) cells.push(d);
  while(cells.length%7) cells.push(null);
  const title = S.calView.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const today = todayStr();
  const dows = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const grid = cells.map(d => {
    if(d===null) return '<div></div>';
    const ds = fmtDate(new Date(y,m,d));
    const past = ds<today, sunday = isSunday(ds), tooFar = ds>addDays(today,60);
    let cls = 'cal-d', extra='', dot='';
    if(past||sunday||tooFar){ cls += sunday&&!past?' closed':' off'; }
    if(ds===b.date) cls+=' sel';
    else if(ds===today) cls+=' today';
    if(!past&&!sunday&&!tooFar){
      if((b._days||[]).includes(ds)){ dot='<span class="free-dot"></span>'; extra=`onclick="pickDate('${ds}')"`; }
      else cls+=' off';
    }
    return `<button class="${cls}" ${extra} ${past||tooFar||!extra?'disabled':''}>${d}${dot}</button>`;
  }).join('');
  return `<div class="cal-head">
    <button class="cal-nav" ${canPrev?'':'disabled'} onclick="calNav(-1)">‹</button><b>${title}</b>
    <button class="cal-nav" ${canNext?'':'disabled'} onclick="calNav(1)">›</button>
  </div><div class="cal-grid">${dows.map(w=>`<div class="cal-dow">${w}</div>`).join('')}${grid}</div>`;
}
function calNav(dir){ S.calView = new Date(S.calView.getFullYear(), S.calView.getMonth()+dir, 1); renderBooking(); }
function pickDate(ds){ const b=S.booking; b.date=ds; b.step=4; renderBooking(); loadSlots(); }

function stepTime(){
  const b = S.booking, s = svc(b.serviceId);
  if(!b._slots) return `<div class="loading"><div class="spin"></div>Carregando horários...</div>`;
  const pName = b.proId==='any'?'Qualquer profissional':(pro(b.proId)||{}).name||'';
  const pEmoji = b.proId==='any'?'🎯':(pro(b.proId)||{}).emoji||'';
  const grid = b._slots.map(sl => {
    let cls='slot', extra=`onclick="pickTime('${sl.time}')"`, label=sl.time;
    if(sl.time===b.time) cls+=' sel';
    if(sl.free){}
    else if(sl.lunch){ cls+=' lunch'; extra=''; }
    else if(sl.past){ cls+=' past'; extra=''; }
    else if(sl.occupied){ cls+=' occupied'; label+=' <span class="mini-oc">oc</span>'; }
    return `<button class="${cls}" ${extra}>${label}</button>`;
  }).join('');
  const noFree = !b._slots.some(x=>x.free);
  let busy='';
  if(b._busy){
    const req = toMin(b._busy);
    const opts = b._slots.filter(x=>x.free).sort((a,c)=>Math.abs(toMin(a.time)-req)-Math.abs(toMin(c.time)-req)||toMin(a.time)-toMin(c.time)).slice(0,2).map(x=>x.time);
    busy = `<div class="busy-box"><b>😕 Esse horário (${b._busy}) já está ocupado</b>
      <p>${opts.length?'Escolha um dos horários livres mais próximos:':'Não há horários livres neste dia. Toque em "mudar dia".'}</p>
      ${opts.length?`<div class="alt-btns">${opts.map(o=>`<button class="alt-btn" onclick="pickFree('${o}')">${o}</button>`).join('')}</div>`:''}</div>`;
  }
  return `<div class="cats">
      <span class="chip" style="border-color:var(--pink);color:var(--pink-dark)">${s.emoji} ${esc(s.name)}</span>
      <span class="chip pro">${b.proId==='any'?`<span class="av" style="background:#F6E7D8">🎯</span>`:proAvatarHTML(pro(b.proId)||{})}${esc(pName)}</span>

      <div class="cal-head"><b style="text-transform:capitalize">${dateLabel(b.date)}</b><b style="color:var(--pink-dark);font-size:14px">${fmtBRL(effPrice(s))}</b></div>

      ${busy}
      <div class="legend"><span><i style="background:var(--pink)"></i>Selecionado</span><span><i style="background:var(--card);border:1.5px solid var(--line)"></i>Livre</span><span><i style="background:repeating-linear-gradient(45deg,#F6EEF0,#F6EEF0 4px,#EFE2E6 4px,#EFE2E6 8px)"></i>Ocupado</span><span><i style="background:#FBF1E8"></i>Almoço</span></div>
    </div>`;
}

  const phoneDigitsVal = digitsOnly(b.phone||'');
  if(!S.isSalon && !returning && phoneDigitsVal.length<10){ const e=$('#errPhone'); if(e)e.style.display='block'; const i=$('#fPhone'); if(i)i.focus(); return; }
  if(!S.isSalon && !isValidCpf(b.cpf)){ const e=$('#errCpf'); if(e)e.style.display='block'; const i=$('#fCpf'); if(i)i.focus(); return; }
  if(S.isSalon && b.cpf && !isValidCpf(b.cpf)){ const e=$('#errCpf'); if(e)e.style.display='block'; const i=$('#fCpf'); if(i)i.focus(); return; }
  if(!S.isSalon && !returning){
    const bd = (b.birthdate||'').trim();
    if(!bd){ const e=$('#errBirth'); if(e)e.style.display='block'; const i=$('#fBirth'); if(i)i.focus(); return; }
  }
  const payload = { serviceId:b.serviceId, date:b.date, time:b.time, proId:b.proId, name:b.name.trim(), phone:b.phone.trim(), cpf:digitsCpf(b.cpf), birthdate:(b.birthdate||'').trim(), notes:(($('#fNotes') && $('#fNotes').value) || b.notes || '').trim(), refCode:(S.isSalon?'':(b.refCode||'').trim()), addonIds:b.addonIds||[], packId:(!S.isSalon && b.packUse && b.packId) ? b.packId : undefined };
  try{
    let d;
    if(S.isSalon) d = await api('/api/salon/appointments', {method:'POST', body:JSON.stringify(payload)});
    else d = await api('/api/public/'+S.slug+'/bookings', {method:'POST', body:JSON.stringify(payload)});
    b._saved = d.appointment;
    b._net = d.netPrice;
    b._payment = d.payment || d.appointment.payment || null;
    b._charge = d.charge || b._charge;
    if(!S.isSalon && !b._payment && payCfgOf().enabled && d.appointment.manageToken){
      try{
        const p = await api('/api/public/'+S.slug+'/bookings/'+d.appointment.id+'/payment', {method:'POST', body:JSON.stringify({token: d.appointment.manageToken})});
        b._payment = p.payment || null;
      }catch(e){ b._payment = {status:'erro', amount:0, error:'Não foi possível gerar o Pix. Solicite a chave Pix ao salão.'}; }
    }
    try{ localStorage.setItem('ba_client_'+S.slug, JSON.stringify({cpf:digitsCpf(b.cpf), name:b.name.trim(), phone:b.phone.trim(), birthdate:(b.birthdate||'').trim()})); }catch(e){}
    b.step = 6;
    if(S.isSalon){ S.appointments.push(d.appointment); }
    const refMsg = { 'ok':'🎁 Código aplicado! Você e quem indicou ganham desconto.', 'codigo-invalido':'⚠️ Esse código de indicação não existe.', 'auto-indicacao':'⚠️ Você não pode usar o seu próprio código.', 'indicador-nao-elegivel':'⚠️ Esse código ainda não pode indicar.' }[d.referralHint];
    toast(d.packLeft!=null ? ('🎟️ Usado o plano · restam '+d.packLeft+' uso(s)') : (d.referralHint==='ok' ? refMsg : (d.referralHint ? refMsg : (d.appointment.status==='pending_payment' ? '💳 Pague para confirmar o horário' : '✨ Horário confirmado!'))));
    renderBooking();
  }catch(e){ toast(e.message); }
}

/* ================= agenda (salão) ================= */
function renderAgenda(){
  if(!S.isSalon){ askLogin(); return; }
  const today = todayStr();
  const ws = weekStartStr(today);
  const isFeito = a => a.status==='confirmed' || a.status==='done';
  const todayList = S.appointments.filter(a=>a.date===today&&isFeito(a));
  const weekList = S.appointments.filter(a=>a.date>=ws&&a.date<=today&&isFeito(a));
  const revToday = todayList.reduce((ac,a)=>ac+appointmentPrice(a),0);
  const revWeek = weekList.reduce((ac,a)=>ac+appointmentPrice(a),0);
  const myPro = S.isPro ? (S.pros.find(x=>x.id===S.proId) || S.pros[0]) : null;
  const myPct = proPct(myPro);
  const earnToday = todayList.reduce((ac,a)=>ac+splitEarn(appointmentPrice(a), myPct),0);
  const earnWeek = weekList.reduce((ac,a)=>ac+splitEarn(appointmentPrice(a), myPct),0);
  const f = [{id:'proximos',lab:'📅 Agendados'},{id:'hoje',lab:'Hoje'},{id:'historico',lab:'📁 Histórico'},{id:'todos',lab:'Todos'}];
  const chips = f.map(x=>`<button class="chip ${S.agendaFilter===x.id?'active':''}" onclick="S.agendaFilter='${x.id}';renderAgenda()">${x.lab}</button>`).join('');
  let list = [...S.appointments];
  if(S.agendaFilter==='proximos') list = list.filter(a=>a.date>=today&&(a.status==='confirmed'||a.status==='pending_payment'));
  if(S.agendaFilter==='hoje') list = list.filter(a=>a.date===today);
  if(S.agendaFilter==='historico') list = list.filter(a=>a.date<today||(a.status!=='confirmed'&&a.status!=='pending_payment'));
  list.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  let html;
  if(!list.length){
    html = `<div class="empty"><div class="big">🗓️</div><b>${S.agendaFilter==='hoje'?'Nada para hoje':'Nada por aqui'}</b>
      <p>Quando você fizer agendamentos, eles aparecem aqui.</p><div class="agenda-actions"><button class="btn small" onclick="startBooking(null)">➕ Novo agendamento</button><button class="btn small ghost" onclick="openWalkInForm()">⚡ Registrar entrada</button></div></div>`;
  } else {
    const groups = {};
    list.forEach(a=>{ (groups[a.date]=groups[a.date]||[]).push(a); });
    html = Object.keys(groups).sort().map(ds=>{
      const g = groups[ds].sort((a,b)=>a.time.localeCompare(b.time));
      return `<div class="day-group"><div class="day-head"><div class="dot"></div><b>${dateLabel(ds)}</b><span class="cnt">${g.length} ${g.length===1?'horário':'horários'}</span></div>${g.map(apptCard).join('')}</div>`;
    }).join('');
  }
  $('#view-agenda').innerHTML = `
    <div class="card hero" style="padding:18px 20px">
      <h1 style="font-size:21px">${S.isPro?'Minha agenda':'Agenda do salão'}</h1>
      <p>${todayNice()} — ${todayList.length} ${todayList.length===1?'agendamento hoje':'agendamentos hoje'}${S.isPro && myPct!=null ? ' · sua parte '+fmtPct(myPct)+' de cada serviço' : ''}.</p>
      <div class="stats" style="margin-top:14px">
        <div class="stat"><div class="n">${todayList.length}</div><div class="l">Serviços hoje</div></div>
        <div class="stat"><div class="n">${fmtBRL(revToday)}</div><div class="l">${S.isPro?'Produzido hoje':'Faturamento hoje'}</div></div>
        ${S.isPro?`<div class="stat"><div class="n">${fmtBRL(earnToday)}</div><div class="l">Seu ganho hoje</div></div><div class="stat"><div class="n">${fmtBRL(earnWeek)}</div><div class="l">Seu ganho na semana</div></div>`:`<div class="stat"><div class="n">${fmtBRL(revWeek)}</div><div class="l">Nesta semana</div></div>`}
      </div>
      <div class="agenda-actions">
        <button class="btn" onclick="startBooking(null)">➕ Novo agendamento</button>
        <button class="btn ghost" onclick="openWalkInForm()">⚡ Registrar atendimento espontâneo</button>
      </div>
    </div>
    ${setupChecklist()}${billingPayCard()}${billingCard()}
    ${helpBanner()}
    ${unreadNotifs()>0 ? `<div class="card" style="padding:14px 16px;margin-top:14px;background:var(--pink-faint);border:1.5px solid var(--pink-soft);display:flex;align-items:center;gap:10px;cursor:pointer" onclick="openNotifs()">
      <span style="font-size:22px">🔔</span>
      <div style="flex:1"><b style="font-size:14px">${unreadNotifs()} ${unreadNotifs()===1?'novo aviso':'novos avisos'}</b><div style="font-size:12px;color:var(--muted)">Toque para ver (novos agendamentos/cancelamentos)</div></div>
      <span style="font-size:18px;color:var(--muted)">›</span>
    </div>` : ''}
    ${remindersHTML()}
    <div class="section-title"><h2>Agendamentos</h2><span class="sub">${S.appointments.filter(a=>(a.status==='confirmed'||a.status==='pending_payment')&&a.date>=today).length} próximos</span></div>
    <div class="filters">${chips}</div>${html}`;
}

function defaultWalkInTime(){
  const d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function walkInSelectedIds(){
  return Array.from(document.querySelectorAll('.wi-svc.on')).map(el => el.getAttribute('data-id')).filter(Boolean);
}
function toggleWalkInService(id){
  const el = document.querySelector('.wi-svc[data-id="'+id+'"]');
  if(!el) return;
  el.classList.toggle('on');
  updateWalkInSummary();
}
function updateWalkInSummary(){
  const ids = walkInSelectedIds();
  const svcs = ids.map(id => S.services.find(x => x.id === id)).filter(Boolean);
  const sumEl = document.getElementById('wiSum');
  const amount = document.getElementById('wiAmount');
  const total = svcs.reduce((a,x)=> a + effPrice(x), 0);
  const mins = svcs.reduce((a,x)=> a + (x.dur||0), 0);
  const names = svcs.map(x => x.name).join(' + ');
  if(sumEl){
    sumEl.textContent = svcs.length
      ? (svcs.length + ' serviço'+(svcs.length>1?'s':'')+' · ' + names + ' · ' + fmtBRL(total) + (mins ? ' · ~'+mins+' min' : ''))
      : 'Selecione um ou mais serviços feitos nesta visita.';
  }
  if(amount && amount.dataset.edited !== '1') amount.value = total;
  const proSelect = document.getElementById('wiPro');
  if(proSelect && svcs.length){
    const cats = new Set(svcs.map(x => x.cat));
    const preferred = S.pros.filter(p => (p.cats||[]).some(c => cats.has(c)));
    const list = preferred.length ? preferred : S.pros;
    const cur = proSelect.value;
    proSelect.innerHTML = list.map(p => `<option value="${p.id}">${p.emoji||'👤'} ${esc(p.name)}</option>`).join('');
    if(list.some(p => p.id === cur)) proSelect.value = cur;
  }
}

    <div class="form-field"><label>Nome da cliente *</label><input id="wiName" placeholder="Ex.: Maria Silva" autocomplete="name"></div>
    <div class="form-field"><label>WhatsApp (opcional)</label><input id="wiPhone" inputmode="tel" placeholder="(21) 99999-9999"></div>
    <div class="form-field"><label>CPF (opcional)</label><input id="wiCpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" oninput="this.value=formatCpf(this.value)"></div>
    <div class="form-field"><label>Data de nascimento (opcional)</label><input id="wiBirth" type="date" max="${todayStr()}" min="1926-01-01"></div>

    <div class="form-field"><label>Como a cliente gosta neste serviço</label><textarea id="wiNotes" placeholder="Ex.: corte chanel; alongamento M; esmalte nude..."></textarea></div>

async function saveWalkIn(){
  const serviceIds = walkInSelectedIds();
  const proId = ($('#wiPro') && $('#wiPro').value) || '';
  const date = ($('#wiDate') && $('#wiDate').value) || todayStr();
  const time = ($('#wiTime') && $('#wiTime').value) || '';
  const name = ($('#wiName') && $('#wiName').value || '').trim();
  const phone = ($('#wiPhone') && $('#wiPhone').value || '').trim();
  const cpf = ($('#wiCpf') && $('#wiCpf').value || '').trim();
  const birthdate = ($('#wiBirth') && $('#wiBirth').value || '').trim();
  const notes = ($('#wiNotes') && $('#wiNotes').value || '').trim();
  const paymentMethod = ($('#wiPayment') && $('#wiPayment').value) || 'nao-informado';
  const amount = parseFloat(($('#wiAmount') && $('#wiAmount').value) || '0');
  if(name.length < 2){ toast('Digite o nome da cliente'); return; }
  if(cpf && !isValidCpf(cpf)){ toast('CPF inválido'); return; }
  if(!serviceIds.length){ toast('Marque pelo menos um serviço realizado'); return; }
  if(!proId || !date || !time){ toast('Preencha profissional, data e horário'); return; }
  if(!Number.isFinite(amount) || amount < 0){ toast('Informe um valor válido'); return; }
  const services = serviceIds.map(id => ({ serviceId: id, proId }));
  try{
    const d = await api('/api/salon/appointments/spontaneous', {method:'POST', body:JSON.stringify({services, proId, date, time, name, phone, cpf, notes, amount, paymentMethod})});
    const list = d.appointments || (d.appointment ? [d.appointment] : []);
    list.forEach(a => S.appointments.push(a));
    S.clients = null;
    S.reports = null;
    closeModal();
    S.agendaFilter = 'hoje';
    toast(list.length > 1 ? ('⚡ '+list.length+' serviços lançados para '+name) : '⚡ Atendimento lançado na agenda e nos relatórios!');
    renderAgenda();
  }catch(e){ toast(e.message); }
}


function remindersHTML(){
  const t = new Date(); t.setDate(t.getDate()+1);
  const tm = fmtDate(t);
  const list = S.appointments.filter(a => a.date===tm && a.status==='confirmed' && a.client.phone);
  if(!list.length) return '';
  const auto = list.some(a => a.reminderStatus && a.reminderStatus !== 'pendente');
  const chips = list.map(a=>{
    const st = a.reminderStatus==='sent' ? ' <span style="color:var(--green);font-size:10.5px">✅ enviado</span>'
      : (a.reminderStatus==='falhou' || a.reminderStatus==='enviando') ? ' <span style="color:var(--amber);font-size:10.5px">⏳ automático</span>' : '';
    return `<button class="mini-btn wa" style="margin:0 6px 6px 0;padding:9px 14px" onclick="waRemind('${a.id}')">${a.time} · ${esc(a.client.name)}${st}</button>`;
  }).join('');
  return `<div class="card" style="padding:16px;margin-top:14px;border:1.5px dashed var(--gold)">
    <div class="section-title" style="margin:0 0 8px"><h2>🔔 Lembretes de amanhã</h2><span class="sub">${list.length} ${auto?'(envio automático ativo)':'para avisar'}</span></div>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:8px">${auto?'Os envios automáticos aparecem com ✅. Você pode reforçar manualmente:':'Toque em um cliente para enviar o lembrete pelo WhatsApp:'}</p>
    ${chips}
  </div>`;
}
function payBadgeHTML(a){
  if(!a.payment) return '';
  const st = a.payment.status;
  if(st==='pago') return `<span class="badge done" style="background:var(--green-soft);color:var(--green)">💳 Pago ${fmtBRL(a.payment.amount)}</span>`;
  if(st==='aguardando') return `<span class="badge" style="background:var(--amber-soft);color:var(--amber)">⏳ Pix avisado</span>`;
  if(st==='pendente') return `<span class="badge canceled" style="background:var(--red-soft);color:var(--red)">💳 Pix pendente ${fmtBRL(a.payment.amount)}</span>`;
  return '';
}
function apptCard(a){
  const s = svc(a.serviceId), p = pro(a.professionalId)||{name:'—',emoji:'🎯'};
  const cls = a.status==='done'?'done':(a.status==='canceled'||a.status==='no_show'?'canceled':'');
  const badge = a.status==='confirmed'?'<span class="badge confirmed">Confirmado</span>'
    : a.status==='done'?'<span class="badge done">Concluído</span>'
    : a.status==='pending_payment'?'<span class="badge" style="background:var(--amber-soft);color:var(--amber)">💳 Aguardando pagamento</span>'
    : a.status==='no_show'?'<span class="badge canceled">Faltou</span>'
    :'<span class="badge canceled">Cancelado</span>';
  const sourceBadge = a.source === 'espontaneo' ? '<span class="badge" style="background:var(--amber-soft);color:var(--amber)">⚡ Espontâneo</span>' : '';
  const pay = a.payment && (a.payment.status==='pendente'||a.payment.status==='aguardando') && !S.isPro
    ? `<button class="mini-btn done" onclick="confirmSalonPay('${a.id}')">✓ Confirmar Pix (${fmtBRL(a.payment.amount)})</button>` : '';
  let actions='';
  if(a.status==='pending_payment'){

async function saveEditAppt(id){
  const name = ($('#eaName') && $('#eaName').value || '').trim();
  if(name.length<2){ toast('Digite o nome do cliente'); return; }
  const date = ($('#eaDate') && $('#eaDate').value)|| '';
  const time = ($('#eaTime') && $('#eaTime').value)|| '';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast('Informe uma data válida'); return; }
  if(!/^\d{2}:\d{2}$/.test(time)){ toast('Informe um horário válido'); return; }
  const cpf = ($('#eaCpf') && $('#eaCpf').value || '').replace(/\D/g,'');
  const body = {
    clientName: name,
    clientPhone: ($('#eaPhone') && $('#eaPhone').value || '').trim(),
    clientCpf: cpf,
    serviceId: ($('#eaSvc') && $('#eaSvc').value) || '',
    professionalId: ($('#eaPro') && $('#eaPro').value) || '',
    date, time,
    notes: ($('#eaNotes') && $('#eaNotes').value || '').trim(),
    paymentMethod: (S.appointments.find(x=>x.id===id)||{}).paymentMethod
  };
  const a = S.appointments.find(x=>x.id===id);
  const isEsp = a && a.source === 'espontaneo';
  if(isEsp){ body.amount = parseFloat(($('#eaAmount') && $('#eaAmount').value)||'0')||0; }
  try{ await api('/api/salon/appointments/'+id, {method:'PATCH', body:JSON.stringify(body)}); }
  catch(e){ toast(e.message); return; }
  const up = S.appointments.find(x=>x.id===id);
  if(up){
    up.client = { name, phone: body.clientPhone, cpf, ...(up.client||{}) };
    up.serviceId = body.serviceId; up.professionalId = body.professionalId;
    up.date = date; up.time = time; up.notes = body.notes;
    if(isEsp){ up.amount = body.amount; }
    // se o serviço mudou, limpa amount derivado p/ recalcular (agendamento normal usa o preço do serviço)
    if(!isEsp && up.amount) delete up.amount;
  }
  closeModal(); toast('💾 Alterações salvas'); renderAgenda();
}

function isPhoneVideoFile(f){
  if(!f) return false;
  const t = String(f.type||'').toLowerCase();
  if(t.startsWith('video/')) return true;
  return /\.(mp4|mov|m4v|webm|3gp|qt)$/i.test(f.name||'');
}
function pickLoopVideo(ev){
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if(!f) return;
  if(!isPhoneVideoFile(f)){ toast('Envie um vídeo (câmera, galeria, MP4 ou MOV)'); return; }
  if(f.size > 25*1024*1024){ toast('Vídeo até 25 MB — grave uns 15 segundos'); return; }
  toast('Lendo o vídeo do celular…');
  const tmp = URL.createObjectURL(f);
  const probe = document.createElement('video');
  probe.preload = 'metadata';
  probe.setAttribute('playsinline','');
  probe.playsInline = true;
  const goRead = function(){
    const reader = new FileReader();
    reader.onerror = () => toast('Não foi possível ler o vídeo');
    reader.onload = function(){
      let data = String(reader.result||'');
      if(data.indexOf('data:application/octet-stream')===0) data = data.replace('data:application/octet-stream', 'data:video/mp4');
      if(data.indexOf('data:video/')!==0 && data.indexOf(';base64,')>0) data = 'data:video/mp4;base64,' + data.split(';base64,').pop();
      S.editing._videoFile = data;
      S.editing._clearVideoFile = false;
      const pv = $('#videoPreview');
      if(pv) pv.innerHTML = `<video src="${S.editing._videoFile}" muted autoplay loop playsinline webkit-playsinline style="width:100%;height:100%;object-fit:cover"></video>`;
      toast('Vídeo pronto — vai rodar em loop na página');
    };
    reader.readAsDataURL(f);
  };
  let done = false;
  const finish = function(checkDur){
    if(done) return;
    done = true;
    try{ URL.revokeObjectURL(tmp); }catch(e){}
    if(checkDur && Number.isFinite(probe.duration) && probe.duration > 25){
      toast('Use um vídeo de até 20 segundos');
      return;
    }
    goRead();
  };
  probe.onloadedmetadata = function(){ finish(true); };
  probe.onerror = function(){ finish(false); };
  setTimeout(function(){ finish(false); }, 2500);
  probe.src = tmp;
}
function removeLoopVideo(){
  if(!S.editing) return;
  S.editing._videoFile = null;
  S.editing._clearVideoFile = true;
  S.editing.videoClip = '';
  const pv = $('#videoPreview');
  if(pv) pv.innerHTML = '🎬';
  toast('Vídeo removido');
}

/* ─── Enquadramento ───────────────────────────────────────────────
   A dona escolhe a proporção, dá zoom e arrasta para achar o melhor
   recorte. Para FOTO o recorte é gravado de verdade no arquivo (canvas),
   então vale para card, destaque, QR e tela da cliente. Para VÍDEO o arquivo
   não é cortado: guardamos a moldura (proporção + zoom + foco) e ela é
   aplicada na tela. */
const FR_RATIOS = [
  {k:'free',  lbl:'Original', r:0},
  {k:'1:1',   lbl:'Quadrado', r:1},
  {k:'3:4',   lbl:'Retrato',  r:3/4},
  {k:'4:5',   lbl:'Feed',     r:4/5},
  {k:'9:16',  lbl:'Story',    r:9/16},
  {k:'4:3',   lbl:'Paisagem', r:4/3},
  {k:'16:9',  lbl:'TV',       r:16/9}
];
function frRatioVal(k){ const f = FR_RATIOS.find(x=>x.k===k); return f ? f.r : 0; }
function frClamp(st, fw, fh){
  const base = Math.max(fw/(st.iw||1), fh/(st.ih||1));
  const sc = base * st.zoom;
  const dw = (st.iw||1)*sc, dh = (st.ih||1)*sc;
  st.dw = dw; st.dh = dh;
  st.ox = Math.min(0, Math.max(fw-dw, st.ox||0));
  st.oy = Math.min(0, Math.max(fh-dh, st.oy||0));
  return sc;
}
/* Desenha o recorte atual no canvas e devolve o data URL (jpg/png) */
function frRender(st, opts){
  const fw = st.fw, fh = st.fh;
  const sc = frClamp(st, fw, fh);
  const maxW = opts.maxW || 900, q = opts.quality || .82, mime = opts.mime || 'image/jpeg';
  let outW = Math.round(fw/sc), outH = Math.round(fh/sc);
  if(outW > maxW){ const k = maxW/outW; outW = Math.round(outW*k); outH = Math.round(outH*k); }
  outW = Math.max(1, outW); outH = Math.max(1, outH);
  const cv = document.createElement('canvas'); cv.width = outW; cv.height = outH;
  const cx = cv.getContext('2d');
  if(mime === 'image/jpeg'){ cx.fillStyle = '#fff'; cx.fillRect(0,0,outW,outH); }
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(st.img, -st.ox/sc, -st.oy/sc, fw/sc, fh/sc, 0, 0, outW, outH);
  let url = cv.toDataURL(mime, q);
  /* nunca devolver base64 que o servidor precisaria cortar: se estourar,
     regenera com menos qualidade/largura até caber (3 tentativas bastam) */
  let guard = 0, qw = outW, qq = q;
  while (url.length > 1400000 && guard < 3) {
    guard++;
    qq = Math.max(0.5, qq - 0.14);
    qw = Math.max(480, Math.round(qw * 0.78));
    const kh = Math.max(1, Math.round(outH * (qw / outW)));
    cv.width = qw; cv.height = kh;
    const c2 = cv.getContext('2d');
    if(mime === 'image/jpeg'){ c2.fillStyle = '#fff'; c2.fillRect(0,0,qw,kh); }
    c2.imageSmoothingQuality = 'high';
    c2.drawImage(st.img, -st.ox/sc, -st.oy/sc, fw/sc, fh/sc, 0, 0, qw, kh);
    url = cv.toDataURL(mime, qq);
  }
  return url;
}
function frClose(){ const ov=document.getElementById('frOverlay'); if(ov){ ov.className='fr-ovl'; ov.innerHTML=''; } }
function openFramar(o){
  /* o = { mode:'photo'|'video', src, ratio, zoom, x, y, fit, maxW, quality, mime,
          title, okLabel, onApply(dataUrl), onFrame(frameObj) } */
  const isVideo = o.mode === 'video';
  const ratios = isVideo ? FR_RATIOS.filter(r=>r.k!=='free' ? true : true) : FR_RATIOS;
  const html = `<h3>${o.title || (isVideo?'Enquadrar vídeo':'Enquadrar foto')}</h3>
    <div class="fr-ratios" id="frRatios">${ratios.map(r=>`<button type="button" data-r="${r.k}">${r.lbl}</button>`).join('')}</div>
    <div class="fr-stage" id="frStage">
      ${isVideo
        ? `<video id="frMedia" src="${esc(o.src)}" muted autoplay loop playsinline webkit-playsinline preload="auto" style="position:absolute;left:0;top:0;width:100%;height:100%"></video>`
        : `<div id="frMedia" style="position:absolute;left:0;top:0;width:100%;height:100%;background-repeat:no-repeat"></div>`}
      <div class="fr-rule v" style="left:33.3%"></div><div class="fr-rule v" style="left:66.6%"></div>
      <div class="fr-rule h" style="top:33.3%"></div><div class="fr-rule h" style="top:66.6%"></div>
    </div>
    <p class="fr-tip" id="frTip">${o.hint || (isVideo?'Escolha a proporção e o enquadramento. O vídeo não é cortado: ele é exibido assim para a cliente.':'Arraste a foto para escolher o corte. Use o zoom para chegar mais perto.')}</p>
    <div class="fr-row"><span>Zoom</span><input type="range" id="frZoom" min="1" max="3.2" step="0.02" value="${o.zoom||1}">
      <button type="button" class="btn small ghost" id="frReset">Centralizar</button></div>
    ${isVideo?`<div class="fr-row"><span>Lado</span><input type="range" id="frX" min="0" max="100" step="1" value="${o.x==null?50:o.x}"></div>
      <div class="fr-row"><span>Altura</span><input type="range" id="frY" min="0" max="100" step="1" value="${o.y==null?50:o.y}"></div>
      <div class="fr-row"><span>Ajuste</span><select id="frFit" style="flex:1"><option value="cover">Preencher (corta as bordas)</option><option value="contain">Mostrar inteiro (com faixas)</option></select></div>`:''}
    <div class="m-actions"><button class="btn ghost" onclick="frClose()">Cancelar</button><button class="btn" id="frOk">${o.okLabel || (isVideo?'Usar este enquadramento':'Usar este corte')}</button></div>`;
  let ov = document.getElementById('frOverlay');
  if(!ov){ ov = document.createElement('div'); ov.id='frOverlay'; ov.className='fr-ovl'; document.body.appendChild(ov); }
  ov.innerHTML = `<div class="fr-box">${html}</div>`;
  ov.className = 'fr-ovl show';
  const $ = s => document.getElementById(s);
  const stage = $('frStage'), media = $('frMedia');
  const FW = Math.min(300, (window.innerWidth||360) - 72);
  const st = { ratio: o.ratio || 'free', zoom: o.zoom || 1, x: (o.x==null?50:+o.x), y: (o.y==null?50:+o.y), fit: o.fit || 'cover',
               ox: 0, oy: 0, iw: 0, ih: 0, fw: FW, fh: FW, img: null };
  function sizeFor(){
    const rv = frRatioVal(st.ratio);
    let fh = rv ? Math.round(FW/rv) : Math.round(FW*(st.ih?st.ih/st.iw:1));
    st.fh = Math.max(96, Math.min(Math.round((window.innerHeight||700)*0.44), fh));
    stage.style.height = st.fh + 'px';
  }
  function paintPhoto(){
    const sc = frClamp(st, st.fw, st.fh);
    media.style.backgroundImage = `url("${o.src}")`;
    media.style.backgroundSize = `${st.iw*sc}px ${st.ih*sc}px`;
    media.style.backgroundPosition = `${st.ox}px ${st.oy}px`;
  }
  function paintVideo(){
    media.style.objectFit = st.fit;
    media.style.objectPosition = st.x + '% ' + st.y + '%';
    media.style.transform = st.zoom > 1 ? 'scale('+st.zoom.toFixed(2)+')' : '';
  }
  function layout(){
    sizeFor();
    document.querySelectorAll('#frRatios button').forEach(b=>b.classList.toggle('on', b.dataset.r===st.ratio));
    if(isVideo) paintVideo(); else paintPhoto();
    if(o.onFrame) o.onFrame(cur());
  }
  function cur(){ return { r: st.ratio, z: +st.zoom.toFixed(2), x: Math.round(st.x), y: Math.round(st.y), fit: st.fit }; }
  if(!isVideo){
    const img = new Image();
    img.onload = ()=>{ st.img = img; st.iw = img.naturalWidth||img.width; st.ih = img.naturalHeight||img.height; layout(); };
    img.onerror = ()=> toast('Não consegui abrir essa imagem');
    img.src = o.src;
  } else { layout(); }
  document.querySelectorAll('#frRatios button').forEach(b=>b.addEventListener('click',()=>{ st.ratio=b.dataset.r; st.ox=0; st.oy=0; layout(); }));
  const zr = $('frZoom'); if(zr) zr.addEventListener('input', e=>{ st.zoom = parseFloat(e.target.value)||1; layout(); });
  const rst = $('frReset'); if(rst) rst.addEventListener('click', ()=>{ st.ox=0; st.oy=0; st.x=50; st.y=50; st.zoom=1; if($('frX'))$('frX').value=50; if($('frY'))$('frY').value=50; zr.value=1; layout(); });
  ['frX','frY','frFit'].forEach(id=>{ const el=$(id); if(!el) return; el.addEventListener('input', e=>{ if(id==='frX') st.x=+e.target.value; else if(id==='frY') st.y=+e.target.value; else st.fit=e.target.value; paintVideo(); if(o.onFrame) o.onFrame(cur()); }); });
  if(!isVideo){
    let drag=null;
    const down=e=>{ drag={x:(e.touches?e.touches[0].clientX:e.clientX),y:(e.touches?e.touches[0].clientY:e.clientY),ox:st.ox,oy:st.oy}; stage.classList.add('drag'); };
    const move=e=>{ if(!drag||!st.iw) return; const cx=(e.touches?e.touches[0].clientX:e.clientX), cy=(e.touches?e.touches[0].clientY:e.clientY);
      st.ox=drag.ox+(cx-drag.x); st.oy=drag.oy+(cy-drag.y); frClamp(st,st.fw,st.fh);
      const sc=Math.max(st.fw/st.iw, st.fh/st.ih)*st.zoom;
      media.style.backgroundPosition=`${st.ox}px ${st.oy}px`; media.style.backgroundSize=`${st.iw*sc}px ${st.ih*sc}px`; if(o.onFrame) o.onFrame(cur()); if(e.cancelable&&e.touches) e.preventDefault(); };
    const up=()=>{ drag=null; stage.classList.remove('drag'); };
    stage.addEventListener('pointerdown',down); window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
    stage.addEventListener('touchstart',down,{passive:true}); stage.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',up);
  }
  const ok = $('frOk'); if(ok) ok.addEventListener('click', ()=>{
    if(isVideo){ if(o.onFrame) o.onFrame(cur()); frClose(); return; }
    let url = o.src;
    try{ url = frRender(st,{maxW:o.maxW, quality:o.quality, mime:o.mime}); }catch(e){ toast('Não foi possível aplicar o corte'); return; }
    if(o.onApply) o.onApply(url, cur());
    frClose();
  });
}
/* moldura do vídeo (não corta o arquivo: aplica na tela) */
function frameCss(f, withRatio){
  if(!f) return '';
  const r = frRatioVal(f.r||'free');
  let s = withRatio && r ? 'aspect-ratio:'+(r).toFixed(4)+';' : '';
  s += 'object-fit:'+(f.fit||'cover')+';object-position:'+(f.x==null?50:f.x)+'% '+(f.y==null?50:f.y)+'%;';
  if(f.z && f.z>1) s += 'transform:scale('+f.z.toFixed(2)+');';
  return s;
}
function serviceFrame(s){ return (s && s.frame) ? s.frame : null; }
/* CSS aplicado no <video>/<iframe> e na caixa, para a moldura valer em todo lugar */
function frMediaStyle(f){ return frameCss(f||null, false); }
function frBoxStyle(f){
  if(!f) return '';
  const r = frRatioVal(f.r||'free');
  return r ? ('aspect-ratio:'+r.toFixed(4)+';') : '';
}

function pickPhoto(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  if(!f.type.startsWith('image/')){ toast('Envie um arquivo de imagem'); return; }
  const reader = new FileReader();
  reader.onerror = () => toast('Não foi possível ler a imagem');
  reader.onload = e => {
    openFramar({ mode:'photo', src: e.target.result, maxW:900, quality:.82, ratio:(S.editing.frame&&S.editing.frame.r)||'free',
      onApply: url => { setServicePhoto(url); toast('📷 Foto enquadrada'); } });
  };
  reader.readAsDataURL(f);
  ev.target.value='';
}
/* reenquadrar a foto que já está salva (ela vem como URL, então baixamos daqui mesmo) */
function reframeServicePhoto(){
  if(!S.editing) return;
  let src = S.editing._photo || (S.editing.photo||'');
  const go = (dataUrl)=> openFramar({ mode:'photo', src:dataUrl, maxW:900, quality:.82, ratio:'free',
    title:'Reenquadrar foto', okLabel:'Usar este corte',
    onApply: url => { setServicePhoto(url); toast('✂️ Corte atualizado'); } });
  if(src && src.indexOf('data:image')===0) return go(src);
  if(!src){ toast('Envie uma foto primeiro'); return; }
  fetch(src).then(r=>r.ok?r.blob():null).then(b=>{
    if(!b){ toast('Não consegui abrir a foto atual'); return; }
    const rd = new FileReader(); rd.onload = e => go(e.target.result); rd.readAsDataURL(b);
  }).catch(()=> toast('Não consegui abrir a foto atual'));
}
/* vídeo: guarda só a moldura (o arquivo não é cortado) */
function frameServiceVideo(){

    onFrame: fr => { S.editing.frame = fr; const pv=$('#videoPreview'); if(pv){ const m=pv.querySelector('video'); if(m) m.setAttribute('style','width:100%;height:100%;'+frameCss(fr,false)); } },
    onApply: null });
}

async function saveService(){
  const name = ($('#svName').value||'').trim();
  const catId = $('#svCat').value;
  const price = parseFloat($('#svPrice').value);
  const promoPrice = parseFloat($('#svPromoPrice').value)||0;
  const dur = parseInt($('#svDur').value,10);
  const promo = $('#svPromo').checked;
  if(name.length<2){ toast('Digite o nome do serviço'); return; }
  if(isNaN(price)||price<0){ toast('Informe o valor (0 ou mais)'); return; }
  const wasPromo = S.editing.promo;
  if(promoPrice>0 && !(promoPrice<price)){ toast('Se informar promoção, o valor precisa ser menor que o preço'); return; }
  if(promo && !wasPromo && S.services.filter(isHighlight).length>=4){ toast('Limite de 4 destaques'); return; }
  const rd = parseInt($('#svRebookDays') && $('#svRebookDays').value, 10);
  const rebookDays = (rd >= 1 && rd <= 365) ? rd : null;
  const video = cleanServiceVideo(($('#svVideo') && $('#svVideo').value) || S.editing.video || '');
  const addons = [0,1,2].map(i => ({
    id: ((S.editing.addons&&S.editing.addons[i]&&S.editing.addons[i].id) || ('ad'+(i+1))),
    name: (($('#adName'+i)&&$('#adName'+i).value) || '').trim(),
    price: parseFloat((($('#adPrice'+i)&&$('#adPrice'+i).value) || '0')) || 0,
    dur: parseInt((($('#adDur'+i)&&$('#adDur'+i).value) || '0'), 10) || 0
  })).filter(a => a.name);
  const payload = { id:S.editing.id||undefined, name, cat:catId, emoji:S.editing.emoji, price, promoPrice, dur, promo, photo:S.editing._photo||null, video, rebookDays, addons,
    videoFile: S.editing._videoFile || undefined,
    clearVideoFile: !!S.editing._clearVideoFile,
    frame: S.editing.frame || null };
  try{
    const d = await api('/api/salon/services', {method:'POST', body:JSON.stringify(payload)});
    const sv = d.service;
    const i = S.services.findIndex(x=>x.id===sv.id);
    if(i>-1) S.services[i]=sv; else S.services.push(sv);
    closeModal();
    renderServicosEditor();
    toast('💾 Serviço atualizado!');
  }catch(e){ toast(e.message); }
}
function askDelService(id){
  const s = S.services.find(x=>x.id===id); if(!s) return;

  if(n>0){ modal(`<h3>🗑️ Não é possível excluir</h3><p><b>${esc(s.name)}</b> tem <b>${n} ${n===1?'agendamento':'agendamentos'}</b> vinculados.</p><div class="m-actions"><button class="btn" onclick="closeModal()">Entendi</button></div>`); return; }

    <div class="m-actions"><button class="btn ghost" onclick="closeModal()">Voltar</button>

async function doDelService(id){
  try{ await api('/api/salon/services/'+id, {method:'DELETE'}); }

  S.services = S.services.filter(x=>x.id!==id);
  closeModal(); renderServicosEditor(); toast('🗑️ Procedimento excluído');
}

async function copyShareText(text, okMsg){
  text = String(text || '');
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
    else {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast(okMsg || '✅ Copiado! Cole no Instagram ou no WhatsApp');
  }catch(e){ toast('Copie manualmente'); }
}
function waShareText(text){
  window.open('https://wa.me/?text=' + encodeURIComponent(String(text || '')), '_blank', 'noopener');
}

  catch(e){ return '/app?slug=' + encodeURIComponent(s); }

function hexPlain(h){ return String(h||'').replace('#',''); }
function bookingQrColors(){
  const th = (typeof curTheme === 'function') ? curTheme() : { primary:'#D63A6B', bg:'#FBF4F6' };
  const primary = th.primary || '#D63A6B';
  const bg = th.bg || '#FBF4F6';
  const darkTheme = lumOf(bg) < 0.45;
  let light, dark;
  if (darkTheme) {
    light = bg;
    dark = lumOf(primary) < 0.38 ? mixColor(primary, '#ffffff', 0.38) : primary;
  } else {
    light = lumOf(bg) > 0.88 ? bg : '#FFFFFF';
    dark = lumOf(primary) > 0.42 ? mixColor(primary, '#000000', Math.min(0.55, lumOf(primary) - 0.22)) : primary;
  }
  if (Math.abs(lumOf(dark) - lumOf(light)) < 0.28) {
    dark = darkTheme ? '#F5EFE8' : '#211A1D';
    light = darkTheme ? bg : '#FFFFFF';
  }
  return {
    dark: dark, light: light, primary: primary, bg: bg,
    text: darkTheme ? '#F5EFE8' : '#35272C',
    muted: darkTheme ? '#B9AFA6' : '#8F7D84',
    contrast: lumOf(primary) > 0.62 ? '#1A1410' : '#FFFFFF'
  };
}
function drawBookingQr(){
  const box = document.querySelector('#salonQrBox');
  if(!box) return;
  const url = publicBookingUrl();
  const c = bookingQrColors();
  box.innerHTML = '';
  box.style.background = c.light;
  const fallback = function(){
    box.innerHTML = '<img alt="QR" width="152" height="152" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&ecc=M&margin=8&color='+hexPlain(c.dark)+'&bgcolor='+hexPlain(c.light)+'&data='+encodeURIComponent(url)+'">';
  };
  if(typeof QRCode === 'undefined'){ fallback(); return; }
  try{
    new QRCode(box, { text:url, width:152, height:152, colorDark:c.dark, colorLight:c.light, correctLevel: QRCode.CorrectLevel.M });
  }catch(e){ fallback(); }
}
function bookingQrDataUrl(){
  const box = document.querySelector('#salonQrBox');
  if(!box) return '';
  const canvas = box.querySelector('canvas');
  if(canvas && canvas.toDataURL) return canvas.toDataURL('image/png');
  const img = box.querySelector('img');
  return img ? img.src : '';
}
function downloadBookingQr(){
  const url = publicBookingUrl();
  const data = bookingQrDataUrl();
  const name = 'qr-agendar-' + ((S.salon && S.salon.slug) || S.slug || 'salao') + '.png';
  if(data && data.indexOf('data:image')===0){
    const a = document.createElement('a'); a.href = data; a.download = name; a.click();
    toast('QR baixado');
    return;
  }
  const c = bookingQrColors();
  window.open('https://api.qrserver.com/v1/create-qr-code/?size=600x600&ecc=M&margin=16&color='+hexPlain(c.dark)+'&bgcolor='+hexPlain(c.light)+'&data=' + encodeURIComponent(url), '_blank');
}
function printBookingQr(){
  const url = publicBookingUrl();
  const name = (S.salon && S.salon.name) || 'Agendamento';
  const slogan = (S.salon && S.salon.cfg && S.salon.cfg.slogan) || 'Aponte a camera e marque o seu horario';

  const w = window.open('', '_blank');
  if(!w){ toast('Permita pop-up para imprimir'); return; }
  const escTxt = function(t){ return String(t||'').replace(/[&<>"]/g, function(ch){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]); }); };
  const closeTag = '</'+'html>';
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>QR — '+escTxt(name)+'</title><style>body{font-family:Georgia,serif;text-align:center;padding:40px;color:'+c.text+';background:'+c.bg+'}h1{font-size:28px;margin:0 0 8px;color:'+c.primary+'}p{color:'+c.muted+';max-width:420px;margin:0 auto 18px;line-height:1.45}img{width:280px;height:280px;background:'+c.light+';padding:14px;border:3px solid '+c.primary+';border-radius:16px}.url{margin-top:16px;font-size:13px;word-break:break-all;color:'+c.muted+'}button{background:'+c.primary+';color:'+c.contrast+';border:none;padding:12px 22px;border-radius:12px;font-weight:700;cursor:pointer}@media print{button{display:none}}</style></head><body><h1>'+escTxt(name)+'</h1><p>'+escTxt(slogan)+'</p><p><b style="color:'+c.primary+'">Escaneie e agende o seu procedimento</b></p><img src="'+qr+'" alt="QR Code"><div class="url">'+escTxt(url)+'</div><p style="margin-top:22px"><button onclick="window.print()">Imprimir</button></p></body>'+closeTag);
  w.document.close();
}

async function saveSalon(){

  const slogan = ($('#salonSlogan').value||'').trim();
  const address = ($('#salonAddress').value||'').trim();
  const contactPhone = ($('#salonContactPhone').value||'').trim();

  const notifyPhone = ($('#salonNotify').value||'').trim();
  const nicho = ($('#salonNicho').value||'salao');

  try{

    else if(slugInput && slugInput !== (S.salon.slug || S.slug)) payload.slug = slugInput;

async function renderClientes(){
  if(!S.isSalon){ askLogin(); return; }
  if(!S.clients){
    $('#view-clientes').innerHTML = '<div class="loading"><div class="spin"></div>Carregando clientes...</div>';
    try{ const d = await api('/api/salon/clients'); S.clients = d.clients || []; }
    catch(e){ S.clients = []; toast(e.message); }
  }
  const q = (S.clientSearch||'').toLowerCase();
  const tab = S.clientTab || 'agenda';
  let list = (S.clients||[]).slice();
  if(q) list = list.filter(c => (c.name||'').toLowerCase().includes(q) || (c.phone||'').includes(q) || digitsCpf(c.cpf||'').includes(digitsOnly(q)));

function clientApptHistory(c){
  const cpf = digitsCpf(c.cpf);
  const nameKey = (c.name||'').trim().toLowerCase();
  return (S.appointments||[]).filter(a => {
    if(cpf && digitsCpf(a.client&&a.client.cpf)===cpf) return true;
    return ((a.client&&a.client.name)||'').trim().toLowerCase()===nameKey;
  }).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
}

async function liberarCobranca(cpf, key){
  const reason = ($('#cliWaiverReason') && $('#cliWaiverReason').value || '').trim();
  try{
    await api('/api/salon/clients/waiver', {method:'POST', body:JSON.stringify({cpf, reason})});
    S.clients = null;
    toast('💚 Cobrança liberada desta vez');
    const d = await api('/api/salon/clients'); S.clients = d.clients || [];
    verCliente(key);
  }catch(e){ toast(e.message); }
}

function pickClientPhoto(ev){
  const f = ev.target.files && ev.target.files[0]; if(!f) return;
  if(!f.type.startsWith('image/')){ toast('Envie uma imagem'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      try{
        const scale = Math.min(1, 600/img.width);
        const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        S._clientPhoto = cv.toDataURL('image/jpeg',0.75);
        const pv = $('#cliPhotoPrev'); if(pv) pv.innerHTML = `<img src="${S._clientPhoto}" alt="">`;
        toast('📷 Foto do cliente pronta');
      }catch(err){ toast('Não foi possível processar a imagem'); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
  ev.target.value='';
}
async function saveClienteProfile(key){
  const phone = ($('#cliPhone').value||'').trim();
  const cpf = digitsCpf($('#cliCpf') && $('#cliCpf').value);
  const notes = ($('#cliNotes').value||'').trim();
  const birthdate = ($('#cliBirth') && $('#cliBirth').value) || '';
  if(cpf && !isValidCpf(cpf)){ toast('CPF inválido'); return; }
  try{
    const serviceNotes = {};
    document.querySelectorAll('.cli-svc-note').forEach(el => {
      const sid = el.getAttribute('data-sid');
      if(sid) serviceNotes[sid] = (el.value||'').trim();
    });
    await api('/api/salon/clients/profile', {method:'PUT', body:JSON.stringify({key, phone, cpf, notes, birthdate, photo:S._clientPhoto||null})});
    await api('/api/salon/clients', {method:'PUT', body:JSON.stringify({key, notes, serviceNotes})});
    const c = (S.clients||[]).find(x=>x.key===key);
    if(c){ c.phone=phone; c.cpf=cpf; c.notes=notes; c.birthdate=birthdate; c.photo=S._clientPhoto; c.serviceNotes=serviceNotes; }
    S.clientServiceNotes = S.clientServiceNotes || {};
    S.clientServiceNotes[key] = Object.assign({}, S.clientServiceNotes[key]||{}, serviceNotes);
    closeModal(); renderClientes(); toast('💾 Cliente atualizado');
  }catch(e){ toast(e.message); }
}

async function salvarCodigoCliente(cpf, name, value, el){
  const code = String(value||'').toLowerCase().trim();
  if(code.length<2){ toast('Código muito curto'); if(el) el.value = name; return; }
  try{
    await api('/api/salon/client-referral', {method:'PUT', body:JSON.stringify({cpf, code})});

    renderClientesIndica();
  }catch(e){ toast(e.message); if(el) el.value = name; }

/* ================= som de novo agendamento + tempo real ================= */
function playChime(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = audioCtx || new AC();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    [[880,0],[1174.66,0.13],[1567.98,0.26]].forEach(([f,dt]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const t0 = now + dt;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.28, t0 + 0.025);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + 0.85);
    });
  } catch(e){ /* navegador sem áudio */ }
}
function toggleSound(on){
  S.soundOn = !!on;
  try{ localStorage.setItem('ba_sound', on ? '1' : '0'); localStorage.removeItem('glowp_sound'); }catch(e){}
  toast(on ? '🔔 Som de agendamento LIGADO' : '🔕 Som de agendamento desligado');
}
function startEvents(){
  if(!S.token || !S.isSalon) return;
  stopEvents();
  try {
    evtSource = new EventSource('/api/salon/events?token=' + encodeURIComponent(S.token));
    evtSource.addEventListener('aviso', (e) => {
      let d = null; try{ d = JSON.parse(e.data); }catch(err){}
      if(d && (d.type === 'novo_agendamento' || d.type === 'cancelamento' || d.type === 'reagendamento' || d.type === 'falta' || d.type === 'aviso' || d.type === 'balanco')){
        if(d.type === 'novo_agendamento' && S.soundOn) playChime();
        refreshSalonData(d.type);
      }
    });
    evtSource.onerror = () => {};
  } catch(e){}
  pollTimer = setInterval(async () => {
    try {
      const before = unreadNotifs();
      const res = await api('/api/salon');
      S.notifications = res.notifications || S.notifications;
      S.appointments = res.appointments;
      updateBell();
      if(S.view === 'agenda') renderAgenda();
      if(unreadNotifs() > before && S.soundOn) playChime();
    } catch(e){}
  }, 45000);
}
function stopEvents(){
  if(evtSource){ try{ evtSource.close(); }catch(e){} evtSource = null; }
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
async function refreshSalonData(type){
  try {
    const res = await api('/api/salon');
    S.notifications = res.notifications || S.notifications;
    S.appointments = res.appointments;
    updateBell();
    if(S.view === 'agenda') renderAgenda();
    toast('🔔 ' + (type === 'novo_agendamento' ? 'Novo agendamento!' : (type === 'reagendamento' ? 'Horário reagendado' : (type === 'falta' ? 'Falta registrada' : 'Agenda atualizada'))));
  } catch(e){}
}

/* ================= avisos (notificações para a dona) ================= */
function unreadNotifs(){ return (S.notifications||[]).filter(n=>!n.read).length; }
function updateBell(){
  const b = $('#bellBtn'), bd = $('#bellBadge');
  const n = unreadNotifs();
  if(!b || !bd) return;
  if(S.mode==='salao'){ b.style.display = 'flex'; bd.style.display = n>0 ? 'flex' : 'none'; bd.textContent = n>9?'9+':n; }
  else b.style.display = 'none';
}
function openNotifs(){
  const list = (S.notifications||[]).length ? (S.notifications||[]).map(n=>{
    const ic = n.type==='cancelamento' ? '<div class="ic warn">⚠️</div>' : (n.type==='aviso' ? '<div class="ic warn" style="background:var(--amber-soft)">⏰</div>' : (n.type==='balanco' ? '<div class="ic" style="background:var(--green-soft)">📊</div>' : '<div class="ic">🆕</div>'));
    const when = fmtWhen(n.createdAt);
    const label = n.type==='cancelamento' ? 'Cancelamento' : (n.type==='falta' ? 'Falta' : (n.type==='aviso' ? 'Aviso' : (n.type==='reagendamento' ? 'Reagendamento' : (n.type==='balanco' ? 'Balanço do mês' : 'Novo agendamento'))));
    return `<div class="notif-item ${n.read?'read':''}"><span class="dot2"></span>${ic}
      <div><b>${label}</b>
      <div style="font-size:13px;margin-top:2px">${esc(n.text)}</div>
      <div class="meta">${when}</div></div></div>`;
  }).join('') : '<div class="empty"><div class="big">🔔</div><b>Nenhum aviso</b><p>Quando uma cliente agendar ou cancelar, você verá aqui.</p></div>';
  modal(`<h3>🔔 Avisos</h3>
    <p style="margin-bottom:6px">Avisos de novos agendamentos e cancelamentos das suas clientes.</p>
    <div style="max-height:46vh;overflow:auto">${list}</div>
    ${unreadNotifs()>0 ? `<div class="m-actions"><button class="btn" onclick="markNotifsRead()">✓ Marcar todas como lidas</button></div>` : ''}
    <p style="font-size:12px;color:var(--muted);margin-top:10px">💡 Com o WhatsApp de avisos da dona (aba Salão) e o da profissional (Horários), a mensagem também chega no celular — se o gateway Z-API/Zapster estiver ativo.</p>`);
}
function fmtWhen(ts){
  if(!ts) return '—';
  const mins = Math.round((Date.now()-ts)/60000);
  if(mins<1) return 'agora';
  if(mins<60) return 'há '+mins+' min';
  const h = Math.round(mins/60);
  if(h<24) return 'há '+h+' h';
  return 'há '+Math.round(h/24)+' d';
}
async function markNotifsRead(){
  try{ await api('/api/salon/notifications/read', {method:'POST', body:JSON.stringify({})}); }
  catch(e){ toast(e.message); return; }
  (S.notifications||[]).forEach(n=>{ n.read = true; });
  updateBell();
  openNotifs();
}

async function startManageReschedule(id, token){
  S._manageRes = { id, token, date:null, time:null, days:null, slots:null, calView:new Date() };
  modal(`<h3>↻ Reagendar</h3><p>Escolha o novo dia. ${payCfgOf().enabled?'Este reagendamento <b>não cobra o sinal de novo</b>.':''}</p><div class="loading"><div class="spin"></div>Carregando dias...</div>`);
  try{
    const data = await api('/api/public/'+S.slug+'/bookings/'+id+'/manage?token='+encodeURIComponent(token));
    const a = data.appointment;
    S._manageRes.serviceId = a.serviceId;
    S._manageRes.proId = a.professionalId || 'any';
    const d = await api('/api/public/'+S.slug+'/days?serviceId='+encodeURIComponent(a.serviceId)+'&proId='+encodeURIComponent(S._manageRes.proId||'any'));
    S._manageRes.days = d.days || [];
    renderManageResCal();
  }catch(e){ toast(e.message); showManageModal(id, token); }
}
function renderManageResCal(){
  const r = S._manageRes; if(!r) return;
  const y = r.calView.getFullYear(), m = r.calView.getMonth();
  const now = new Date();
  const canPrev = r.calView >= new Date(now.getFullYear(), now.getMonth(), 1);
  const canNext = r.calView < new Date(now.getFullYear(), now.getMonth()+3, 1);
  const firstDow = new Date(y,m,1).getDay(), dim = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1;d<=dim;d++) cells.push(d);
  while(cells.length%7) cells.push(null);
  const title = r.calView.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const today = todayStr();
  const dows = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const grid = cells.map(d => {
    if(d===null) return '<div></div>';
    const ds = fmtDate(new Date(y,m,d));
    const past = ds<today, sunday = isSunday(ds);
    let cls = 'cal-d', extra='', dot='';
    if(past||sunday){ cls += sunday&&!past?' closed':' off'; }
    if(ds===r.date) cls+=' sel';
    else if(ds===today) cls+=' today';
    if(!past&&!sunday && (r.days||[]).includes(ds)){ dot='<span class="free-dot"></span>'; extra=`onclick="pickManageResDate('${ds}')"`; }
    else if(!extra) cls+=' off';
    return `<button class="${cls}" ${extra} ${!extra?'disabled':''}>${d}${dot}</button>`;
  }).join('');
  modal(`<h3>↻ Reagendar</h3>
    <p>Escolha o novo dia.</p>
    <div class="cal-card card" style="margin-top:8px">
      <div class="cal-head">
        <button class="cal-nav" ${canPrev?'':'disabled'} onclick="S._manageRes.calView=new Date(${y},${m-1},1);renderManageResCal()">‹</button>
        <b>${title}</b>
        <button class="cal-nav" ${canNext?'':'disabled'} onclick="S._manageRes.calView=new Date(${y},${m+1},1);renderManageResCal()">›</button>
      </div>
      <div class="cal-grid">${dows.map(w=>`<div class="cal-dow">${w}</div>`).join('')}${grid}</div>
    </div>
    <div class="m-actions"><button class="btn ghost" onclick="showManageModal('${r.id}','${r.token}')">Voltar</button></div>`);
}
async function pickManageResDate(ds){
  const r = S._manageRes; if(!r) return;
  r.date = ds; r.time = null; r.slots = null;
  modal(`<h3>↻ Reagendar</h3><p>${dateLabel(ds)} — carregando horários...</p><div class="loading"><div class="spin"></div></div>`);
  try{
    const d = await api('/api/public/'+S.slug+'/slots?serviceId='+encodeURIComponent(r.serviceId)+'&date='+ds+'&proId='+encodeURIComponent(r.proId||'any')+'&exceptId='+encodeURIComponent(r.id));
    r.slots = d.slots || [];
    renderManageResSlots();
  }catch(e){ toast(e.message); renderManageResCal(); }
}
function renderManageResSlots(){
  const r = S._manageRes; if(!r) return;
  const free = (r.slots||[]).filter(x=>x.free);
  const grid = (r.slots||[]).map(sl => {
    let cls='slot', extra=`onclick="doManageReschedule('${sl.time}')"`, label=sl.time;
    if(sl.time===r.time) cls+=' sel';
    if(!sl.free){
      if(sl.lunch){ cls+=' lunch'; extra=''; }
      else if(sl.past){ cls+=' past'; extra=''; }
      else { cls+=' occupied'; extra=''; label+=' <span class="mini-oc">oc</span>'; }
    }
    return `<button class="${cls}" ${extra}>${label}</button>`;
  }).join('');
  modal(`<h3>↻ Reagendar</h3>
    <p>Novo dia: <b style="text-transform:capitalize">${dateLabel(r.date)}</b>. Toque no horário livre.</p>
    ${free.length?`<div class="slots">${grid}</div>`:`<div class="empty"><div class="big">😴</div><b>Sem horários livres</b></div>`}
    <div class="m-actions"><button class="btn ghost" onclick="renderManageResCal()">← Outro dia</button></div>`);
}

function setAvailOn(proId, day, on){ S.availability.schedule[proId][day].on = on; renderDisp(); }
function setAvail(proId, day, field, val){ S.availability.schedule[proId][day][field] = val; }
async function saveAvail(proId){
  const sched = S.availability.schedule[proId];
  const days = DOW.filter(d=>d!=='sun'&&sched[d]&&sched[d].on);
  for(const d of days){
    const c = sched[d];
    if(!c.start||!c.end||c.start>=c.end){ toast('Horário inválido em '+DOW_LABELS[d]); return; }
    if(c.lunchStart>=c.lunchEnd){ toast('Intervalo de almoço inválido em '+DOW_LABELS[d]); return; }
    if(c.lunchStart<c.start||c.lunchEnd>c.end){ toast('Almoço fora do expediente em '+DOW_LABELS[d]); return; }
    if(toMin(c.end)-toMin(c.start)<60){ toast('Mínimo de 1h em '+DOW_LABELS[d]); return; }
  }
  const conflicts = [];
  S.appointments.forEach(a=>{
    if(a.professionalId!==proId||(a.status!=='confirmed'&&a.status!=='done')) return;
    const dayKey = DOW[new Date(a.date+'T12:00:00').getDay()];
    const cfg = sched[dayKey];
    const off = (S.availability.offDays[proId]||[]).includes(a.date);
    if(!cfg||!cfg.on||off){ conflicts.push(a); return; }
    const st = toMin(a.time), du = durOf(a.serviceId);
    if(st<toMin(cfg.start)||st+du>toMin(cfg.end)){ conflicts.push(a); return; }
    if(st<toMin(cfg.lunchEnd)&&st+du>toMin(cfg.lunchStart)) conflicts.push(a);
  });
  if(conflicts.length){
    const names = conflicts.slice(0,5).map(a=>`• ${esc(a.client.name)} — ${esc(svc(a.serviceId).name)} (${dateLabel(a.date)} ${a.time})`).join('<br>');
    modal(`<h3>⚠️ Conflito com a agenda</h3>
      <p><b>${conflicts.length}</b> ${conflicts.length===1?'agendamento fica':'agendamentos ficam'} fora do novo horário:<br><br>${names}${conflicts.length>5?'<br>…':''}</p>
      <p style="margin-top:10px">Cancele ou mova esses horários antes de salvar.</p>
      <div class="m-actions"><button class="btn ghost" onclick="closeModal()">Voltar e ajustar</button><button class="btn" onclick="doSaveAvail('${proId}')">Salvar mesmo assim</button></div>`);
    return;
  }
  doSaveAvail(proId);
}

  try{
    await api('/api/salon/availability', {method:'PUT', body:JSON.stringify({schedule:S.availability.schedule, offDays:S.availability.offDays})});
    toast('✅ Horários salvos!');

async function addOffDay(proId){
  const inp = $('#offDate'); const ds = inp && inp.value;
  if(!ds){ toast('Escolha a data da folga'); return; }
  if(isSunday(ds)){ toast('Domingo já é fechado'); return; }
  const conflicts = S.appointments.filter(a=>a.professionalId===proId&&a.date===ds&&(a.status==='confirmed'||a.status==='done'));
  if(conflicts.length){
    modal(`<h3>⚠️ Dia com agendamentos</h3><p>${pro(proId).name} tem <b>${conflicts.length} ${conflicts.length===1?'agendamento':'agendamentos'}</b> nesse dia (${dateLabel(ds)}). Cancele ou mova antes de marcar a folga.</p><div class="m-actions"><button class="btn" onclick="closeModal()">Entendi</button></div>`);
    return;
  }
  (S.availability.offDays[proId]=S.availability.offDays[proId]||[]).push(ds);
  try{ await api('/api/salon/availability', {method:'PUT', body:JSON.stringify({schedule:S.availability.schedule, offDays:S.availability.offDays})}); toast('📆 Folga adicionada'); renderDisp(); }
  catch(e){ S.availability.offDays[proId]=S.availability.offDays[proId].filter(x=>x!==ds); toast(e.message); }
}

  S.availability.offDays[proId] = (S.availability.offDays[proId]||[]).filter(x=>x!==ds);

  catch(e){ toast(e.message); }

async function quickCreateSvcForPlan(){
  const name=(document.getElementById('plQuickName')?.value||'').trim();
  const price=parseFloat(String(document.getElementById('plQuickPrice')?.value||'').replace(',','.'))||0;
  const dur=parseInt(document.getElementById('plQuickDur')?.value,10)||60;
  if(name.length<2){ toast('Digite o nome do serviço/curso'); return; }
  if(!(price>=0)){ toast('Preço inválido'); return; }
  try{
    const cat = (S.salon?.cfg?.nicho==='clinica'?'clinica': (S.salon?.cfg?.nicho||'salao'));
    const r=await api('/api/salon/services',{method:'POST', body:JSON.stringify({name, price, dur, cat, promo:false})});
    const svc=r.service;
    // add to local state so it appears immediately
    if(!S.services) S.services=[];
    S.services.push(svc);
    if(!S.salon) S.salon={}; if(!S.salon.services) S.salon.services=S.services;
    // append checkbox and check it
    const list=document.getElementById('plSvcList');
    if(list){
      const empty=list.querySelector('p');
      if(empty) empty.remove();
      const label=document.createElement('label');
      label.style.cssText='display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 2px';
      label.innerHTML='<input type="checkbox" value="'+svc.id+'" checked> '+(svc.emoji||'✨')+' '+esc(svc.name);
      list.appendChild(label);
    }
    document.getElementById('plQuickName').value=''; document.getElementById('plQuickPrice').value=''; document.getElementById('plQuickDur').value='';
    toast('✅ Serviço criado e já marcado');
  }catch(e){ toast(e.message||'Erro ao criar serviço'); }
}
async function savePlan(i){
  const cur = i>=0 ? (((S._planData&&S._planData.plans)||[])[i]||null) : null;
  const plans = ((S._planData&&S._planData.plans)||[]).slice();
  const next = { id: cur?cur.id:undefined, name:($('#plName').value||'').trim(), desc:($('#plDesc').value||'').trim(),
    uses:parseInt($('#plUses').value,10)||1, days:parseInt($('#plDays').value,10)||0,
    price:parseFloat(String($('#plPrice').value||'0').replace(',','.'))||0,
    noShowUses:!!$('#plNoShow').checked, active:!!$('#plActive').checked,
    services:[].slice.call(document.querySelectorAll('#plSvcList input:checked')).map(x=>x.value),
    type:(document.getElementById('plType')||{}).value==='curso'?'curso':'servicos',
    renewable:!!(document.getElementById('plRenew')||{}).checked,
    featured:!!(document.getElementById('plFeat')||{}).checked,
    sessions:((document.getElementById('plSessions')||{}).value||'').split('\n').map(function(row){
      row=String(row||'').trim(); if(!row) return null;
      const m=row.match(/^(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2})\s*[:h]\s*(\d{2}))?\s*(?:[-–:]?\s*(.*))?$/i);
      if(!m) { const m2=row.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})\s*(?:[-–:]?\s*(.*))?$/); if(!m2) return null;
        return { date:m2[1]+'-'+m2[2]+'-'+m2[3], time:String(m2[4]).padStart(2,'0')+':'+m2[5], label:(m2[6]||'').trim() }; }
      const now=new Date(); let yy=m[5]?now.getFullYear():now.getFullYear();
      const dd=String(m[1]).padStart(2,'0'), mo=String(m[2]).padStart(2,'0');
      const cand=new Date(yy,(+mo)-1,+dd,12,0,0);
      if(cand.getTime() < now.getTime()-864e5*2) cand.setFullYear(cand.getFullYear()+1);
      const hh=m[3]?String(m[3]).padStart(2,'0'):'09', mi=m[4]||'00';
      return { date:cand.getFullYear()+'-'+mo+'-'+dd, time:hh+':'+mi, label:(m[6]||'').trim() };
    }).filter(Boolean) };
  if(next.name.length<2){ toast('Dê um nome ao plano'); return; }
  if(!next.services.length){ toast('Marque pelo menos 1 serviço incluso'); return; }
  if(i>=0){ if(cur) next.id=cur.id; plans[i]=next; } else plans.push(next);
  try{ await api('/api/salon/plans',{method:'PUT',body:JSON.stringify({plans})}); closeModal(); toast('💾 Plano salvo'); await renderPlanos(); }catch(e){ toast(e.message||e); }
}

  sec.innerHTML='<b>🎟️ Planos do espaço</b><p style="font-size:12.5px;opacity:.7;margin:4px 0 10px">Pague uma vez, use no mês (ou no prazo do pacote). Simples assim.</p>'+myStrip+
   plans.map(x=>'<div style="border:1px solid var(--line,#e3e3e3);border-radius:14px;padding:12px;margin-top:8px">'+
   '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><b>'+(x.featured?'⭐ ':'')+esc(x.name)+'</b><b style="color:#0abab5">'+fmtBRL(x.price)+'</b></div>'+
   '<div style="font-size:12.5px;opacity:.8;margin-top:3px">'+(x.type==='curso'?'🎓 curso com datas fixas · ':'')+x.uses+' uso(s)'+(x.days?(' · vale '+x.days+' dias'):' · sem prazo')+(x.renewable?' · 🔁 pode renovar':'')+(x.services&&x.services.length?(' · '+x.services.map(sv=>(sv.emoji?sv.emoji+' ':'')+esc(sv.name)).join(', ')):'')+'</div>'+
   ((x.sessions&&x.sessions.length)?('<div style="font-size:12px;margin-top:6px;padding:8px 10px;border-radius:10px;background:rgba(10,186,181,.07)"><b>📅 Datas do curso:</b><br>'+x.sessions.slice(0,6).map(ss=>'• '+pkFmt(ss.date)+' '+ss.time+(ss.label?(' — '+esc(ss.label)):'')).join('<br>')+(x.sessions.length>6?('<br>… +'+(x.sessions.length-6)+' outras'):'')+'</div>'):'')+
   (x.desc?('<div style="font-size:12px;opacity:.65;margin-top:4px">'+esc(x.desc)+'</div>'):'')+
   '<button class="btn small" style="margin-top:8px" onclick="planInterest(\''+x.id+'\',\''+esc(x.name).replace(/'/g,'')+'\')">🎟️ Quero esse</button></div>').join('');
  const anchor=el.querySelector('.card')||el.children[1]||el.lastElementChild;
  if(anchor&&anchor.parentNode) anchor.parentNode.insertBefore(sec, anchor.nextSibling); else el.appendChild(sec);
}
async function planInterest(id,name){
  modal('<h3>🎟️ '+esc(name)+'</h3><p style="font-size:13px">Envie o pedido — o espaço reserva o pacote para você e ativa assim que confirmar o Pix.</p>'+
   '<div class="form-field"><label>Seu nome</label><input id="piName" value="'+esc((S.booking&&S.booking.name)||'')+'"></div>'+
   '<div class="form-field"><label>WhatsApp</label><input id="piPhone" inputmode="tel" placeholder="(21) 99999-9999"></div>'+
   '<div class="form-field"><label>CPF (opcional — junta aos seus horários)</label><input id="piCpf" inputmode="numeric" placeholder="000.000.000-00"></div>'+
   '<div class="m-actions"><button class="btn ghost" onclick="closeModal()">Agora não</button><button class="btn" onclick="planInterestGo(\''+id+'\')">Enviar pedido</button></div>');
}
async function renewMyPlan(cpf){
  try{ const d=await api('/api/public/'+S.slug+'/plan-renew',{method:'POST',body:JSON.stringify({cpf})}); toast('🔁 '+((d.instructions||'Pedido enviado!').slice(0,80))); }catch(e){ toast(e.message||e); }
}
async function planInterestGo(id){
  try{
    const d=await api('/api/public/'+S.slug+'/plan-interest',{method:'POST',body:JSON.stringify({planId:id,name:($('#piName').value||'').trim(),phone:($('#piPhone').value||'').trim(),cpf:($('#piCpf').value||'').trim()})});
    closeModal();
    modal('<h3>🎉 Pedido enviado!</h3><p style="font-size:13.5px">'+esc((d.instructions||'').replace(/\*/g,''))+'</p><div class="m-actions"><button class="btn" onclick="closeModal()">Beleza</button></div>');
  }catch(e){ toast(e.message||e); }
}
</script>
</body>
