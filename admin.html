<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D63A6B">
<title>Painel — BoraAgendar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='8' width='84' height='84' rx='20' fill='%23D63A6B'/%3E%3Ctext x='50' y='66' font-size='44' text-anchor='middle'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E">
<style>
  :root{--pink:#D63A6B;--pink-dark:#B92C59;--pink-soft:#FBE9EE;--pink-faint:#FDF6F8;--pink-grad:#E8789C;--pink-contrast:#FFFFFF;--dark:#35272C;--muted:#8F7D84;--line:#F0E2E7;--bg:#FBF4F6;--card:#FFFFFF;--green:#2FA36B;--green-soft:#E4F6EC;--red:#D64545;--red-soft:#FDEBEB;--amber:#C99B3F;--amber-soft:#FFF3C4;--blue:#3E6FB0;--blue-soft:#E9F0FA;--radius:20px;--shadow:0 6px 24px rgba(214,58,107,.10);--font-body:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;--font-heading:Georgia,'Times New Roman',serif}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font-body);background:var(--bg);color:var(--dark);min-height:100vh;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--font-heading)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--dark)}
  input[type=month],input[type=date],input[type=number],input[type=text],input[type=password],textarea,select{background:var(--card);color:var(--dark);border:1px solid var(--line)}
  input[type=month],input[type=date]{border-radius:12px;padding:9px 11px}
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(150deg,var(--bg),var(--pink-soft))}
  .login-box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;max-width:380px;width:100%;box-shadow:0 16px 50px rgba(214,58,107,.18);text-align:center}
  .login-box .logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--pink),var(--pink-grad));display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto;box-shadow:0 8px 20px rgba(214,58,107,.35)}
  .login-box h1{font-size:21px;margin-top:14px}
  .login-box p{color:var(--muted);font-size:13px;margin-top:6px}
  .login-box input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);outline:none;margin-top:12px;background:var(--card);color:var(--dark)}
  .login-box input:focus{border-color:var(--pink)}
  .pass-wrap{position:relative;margin-top:12px}
  .pass-wrap input{width:100%;padding:13px 44px 13px 14px;border-radius:12px;border:1.5px solid var(--line);outline:none;margin-top:0;background:var(--card);color:var(--dark)}
  .pass-wrap input:focus{border-color:var(--pink)}
  .pass-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:19px;cursor:pointer;padding:4px;opacity:.7}
  .pass-eye:hover{opacity:1}
  .app{display:flex;min-height:100vh}
  .sidebar{width:228px;background:var(--card);color:var(--dark);flex-shrink:0;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);box-shadow:6px 0 24px rgba(214,58,107,.06)}
  .s-logo{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;border-bottom:1px solid var(--line)}
  .s-logo .ic{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--pink),var(--pink-grad));display:flex;align-items:center;justify-content:center;font-size:18px}
  .s-logo b{font-size:15px;display:block}
  .s-logo span{font-size:11px;color:var(--muted)}
  .s-nav{display:flex;flex-direction:column;gap:3px;margin-top:14px}
  .s-nav button{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--muted);text-align:left;transition:.15s}
  .s-nav button .ic{font-size:17px;width:22px;text-align:center}
  .s-nav button:hover{background:var(--pink-soft);color:var(--pink-dark)}
  .s-nav button.active{background:linear-gradient(135deg,var(--pink),var(--pink-grad));color:var(--pink-contrast)}
  .s-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.5}
  .s-foot button{color:var(--pink-dark);font-weight:700;font-size:12px;margin-top:6px}
  .main{flex:1;min-width:0;padding:22px 24px 60px;max-width:1200px}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .topbar h1{font-size:22px}
  .topbar .sub{color:var(--muted);font-size:13px}
  .topbar .spacer{flex:1}
  button.user-chip{font-family:inherit;color:inherit}
  .user-chip{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-size:13px;font-weight:700;cursor:pointer;max-width:220px}
  .user-chip:hover{border-color:var(--pink)}
  .user-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .emoji-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .emoji-pick button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:18px;cursor:pointer}
  .emoji-pick button.on{border-color:var(--pink);background:var(--pink-soft)}
  .user-chip .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--pink-grad));color:var(--pink-contrast);display:flex;align-items:center;justify-content:center;font-size:13px}
  .hamb{display:none;width:40px;height:40px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:18px}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
  .section-title h2{font-size:17px}
  .section-title .sub{color:var(--muted);font-size:12.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card.pad{padding:18px}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .k{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .kpi .n{font-size:26px;font-weight:800;margin-top:6px}
  .kpi .d{font-size:12px;color:var(--muted);margin-top:4px}
  .kpi .em{position:absolute;right:14px;top:14px;font-size:22px;opacity:.85}
  .kpi.up .n{color:var(--green)}.kpi.down .n{color:var(--red)}.kpi.pink .n{color:var(--pink-dark)}.kpi.amber .n{color:var(--amber)}.kpi.blue .n{color:var(--blue)}
  .two{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
  @media(min-width:1000px){.two{grid-template-columns:1.4fr 1fr}}
  .chart{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:14px}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
  .chart-col .bar{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--pink-grad),var(--pink));min-height:4px;position:relative}
  .chart-col .bar span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--pink-dark);white-space:nowrap}
  .chart-col .lab{font-size:11px;color:var(--muted);font-weight:600}
  .list-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .list-row:last-child{border-bottom:none}
  .list-row .av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;background:var(--pink-soft)}
  .list-row .main{flex:1;min-width:0}
  .list-row .main b{font-size:14px;display:block}
  .list-row .main span{font-size:12px;color:var(--muted)}
  .list-row .right{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:200px;padding:12px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);outline:none;color:var(--dark)}
  .search:focus{border-color:var(--pink)}
  .btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--pink),var(--pink-grad));color:var(--pink-contrast);font-weight:700;font-size:14px;padding:12px 18px;border-radius:14px;box-shadow:0 8px 20px rgba(214,58,107,.35)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--card);color:var(--pink-dark);border:1.5px solid var(--pink);box-shadow:none}
  .btn.small{padding:8px 13px;font-size:12.5px;border-radius:10px}
  .btn.full{width:100%;justify-content:center}
  .badge{font-size:11px;font-weight:800;padding:4px 11px;border-radius:999px;letter-spacing:.3px}
  .badge.ativo{background:var(--green-soft);color:var(--green)}
  .badge.teste{background:var(--amber-soft);color:var(--amber)}
  .badge.suspenso,.badge.bloqueado{background:var(--red-soft);color:var(--red)}
  .badge.vencido{background:var(--red-soft);color:var(--red)}
  .badge.teste{background:var(--amber-soft);color:var(--amber)}
  .cat-pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
  .cat-pills button{border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:750;cursor:pointer}
  .cat-pills button .n{margin-left:6px;font-size:11px;font-weight:850}
  .cat-pills button.on{border-color:var(--pink);color:var(--pink-dark, var(--pink));background:var(--pink-soft,#FCE7F0)}
  .cat-head{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
  .cat-head h3{margin:0;font-size:16px}
  .cat-head .sub{color:var(--muted);font-size:12.5px}
  .badge.aberto{background:var(--blue-soft);color:var(--blue)}
  .badge.resolvido{background:var(--green-soft);color:var(--green)}
  .badge.pago{background:var(--green-soft);color:var(--green)}
  .badge.atrasado{background:var(--red-soft);color:var(--red)}
  .salon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:8px}
  .salon{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:.15s;text-align:left;width:100%}
  .salon:hover{border-color:var(--pink);transform:translateY(-2px)}
  .salon .head{display:flex;align-items:center;gap:11px}
  .salon .logo{width:46px;height:46px;border-radius:13px;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
  .salon .name{font-size:15px;font-weight:800;line-height:1.2}
  .salon .plan{font-size:11.5px;color:var(--muted)}
  .salon .stats{display:flex;gap:10px;margin:14px 0 4px}
  .salon .stat{flex:1;min-width:60px}
  .salon .stat .n{font-size:16px;font-weight:800;color:var(--pink-dark)}
  .salon .stat .l{font-size:10.5px;color:var(--muted)}
  .salon .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
  .salon .last{font-size:11.5px;color:var(--muted)}
  .salon .status{display:flex;gap:6px}
  .overlay{position:fixed;inset:0;background:rgba(53,39,44,.45);z-index:90;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(2px)}
  .overlay.show{display:flex;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--card);border-radius:20px;max-width:580px;width:100%;padding:24px;max-height:88vh;overflow:auto;animation:pop .3s cubic-bezier(.2,1.3,.4,1);color:var(--dark)}
  @keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
  .modal h3{font-size:19px}
  .modal p{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:6px}
  .modal .m-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .modal .m-actions button{flex:1;min-width:130px}
  .m-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .m-row .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;min-width:96px}
  .m-row .v{font-size:14px;font-weight:700}
  .form-field{margin-top:14px}
  .form-field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .form-field input,.form-field select,.form-field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);outline:none;background:var(--card);color:var(--dark)}
  .form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--pink)}
  .appt{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
  .appt:last-child{border:none}
  .appt .time{background:var(--pink-soft);color:var(--pink-dark);font-weight:800;font-size:12.5px;padding:6px 9px;border-radius:9px;min-width:50px;text-align:center;flex-shrink:0}
  .appt .info{flex:1;min-width:0}
  .appt .info b{font-size:13.5px;display:block}
  .appt .info span{font-size:12px;color:var(--muted)}
  .support-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;box-shadow:var(--shadow)}
  .support-card .ic{width:38px;height:38px;border-radius:11px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
  .support-card b{font-size:14px;display:block}
  .support-card p{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .support-card .meta{margin-left:auto;font-size:11px;color:var(--muted);text-align:right;flex-shrink:0;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .note{background:var(--amber-soft);border:1px solid var(--amber);color:var(--amber);border-radius:13px;padding:12px 15px;font-size:13px;line-height:1.55;margin-bottom:16px}
  .loading{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);padding:60px 0;font-size:14px}
  .spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--pink);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:900px){
    .sidebar{position:fixed;left:-240px;top:0;height:100vh;z-index:80;transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.25)}
    .sidebar.open{left:0}
    .hamb{display:inline-flex;align-items:center;justify-content:center}
    .main{padding:16px 14px 60px}
  }
</style>
</head>
<body>
<div id="loginScreen" class="login">
  <div class="login-box">
    <div class="logo"><img src="/icons/icon-192.png?v=20260909" alt="BoraAgendar" style="width:100%;height:100%;object-fit:contain"></div>
    <h1>Painel da plataforma</h1>
    <p>Acesso da administração</p>
    <input type="email" id="lgEmail" placeholder="E-mail" autocomplete="username">
    <div class="pass-wrap">
      <input type="password" id="lgPass" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button type="button" class="pass-eye" onclick="togglePass('lgPass', this)" aria-label="Mostrar/esconder senha">👁️</button>
    </div>
    <button class="btn full" style="margin-top:16px" onclick="doLogin()">Entrar</button>
  </div>
</div>

<div id="appScreen" class="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="s-logo"><img src="/icons/icon-192.png?v=20260909" alt="" style="width:36px;height:36px;object-fit:contain"><div><b>BoraAgendar</b><span>Painel</span></div></div>
    <nav class="s-nav" id="snav"></nav>
    <div class="s-foot">Seu acesso<br><b style="color:var(--dark)" id="adminFootName">Admin</b><br>
      <button onclick="askAdminProfile()">✏️ Editar perfil</button><br>
      <button onclick="askPassword()">🔒 Alterar senha</button><br>
      <button onclick="downloadBackup()">⬇️ Backup dos dados</button><br>
      <button onclick="openRestore()">♻️ Restaurar backup</button><br>
      <button onclick="logout()">🚪 Sair</button></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="hamb" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div><h1 id="pageTitle">Visão geral</h1><div class="sub" id="pageSub"></div></div>
      <div class="spacer"></div>
      <button type="button" class="user-chip" id="adminChip" onclick="askAdminProfile()" title="Toque para editar nome e ícone"><div class="av" id="adminChipEmoji">💎</div><span id="adminChipName">Admin</span><span style="opacity:.55;font-size:12px">✎</span></button>
    </div>
    <div id="content"><div class="loading"><div class="spin"></div>Carregando...</div></div>
  </main>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
<div id="toastX" style="position:fixed;top:16px;left:50%;transform:translate(-50%,-90px);z-index:120;background:var(--dark);color:var(--card);padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.3);transition:transform .3s;max-width:92%;text-align:center"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
let TOKEN = localStorage.getItem('ba_admin') || localStorage.getItem('glowp_admin') || null;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBRL = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
let PLAN_PRICES = {'Básico':69,'Pro':139,'Premium':249}; /* pode ser sobrescrito pelo gateway */
let page = 'dash', salons = [], tickets = [], dash = null, searchQ = '';
let salonCat = 'todos';
let toastTimer;
function toast(msg){ const t=$('#toastX'); t.textContent=msg; t.style.transform='translate(-50%,0)'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.transform='translate(-50%,-90px)',3200); }

const THEME_DEFAULT = {primary:'#D63A6B', bg:'#FBF4F6', font:'padrao'};
const THEME_PRESETS = [
  {id:'rosa', label:'Rosa BoraAgendar', primary:'#D63A6B', bg:'#FBF4F6'},
  {id:'barbearia', label:'Barbearia Preto & Dourado', primary:'#C9A227', bg:'#1F1B16'},
  {id:'azul', label:'Azul Marinho', primary:'#2E5FA3', bg:'#F2F6FB'},
  {id:'verde', label:'Verde Esmeralda', primary:'#1E8A5F', bg:'#F1F8F4'},
  {id:'roxo', label:'Roxo', primary:'#7A4FC0', bg:'#F7F3FC'},
  {id:'terracota', label:'Terracota', primary:'#C96A3D', bg:'#FBF4F0'},
  {id:'vermelho', label:'Vermelho', primary:'#C93A3A', bg:'#FBF3F3'}
];
const THEME_FONT_OPTS = [
  {id:'padrao', label:'Moderna (padrão)', body:"'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif", head:"Georgia, 'Times New Roman', serif"},
  {id:'elegante', label:'Elegante (serifada)', body:"Georgia, 'Times New Roman', serif", head:"Georgia, 'Times New Roman', serif"},
  {id:'moderna', label:'Moderno sem serifa', body:"'Segoe UI', system-ui, Arial, sans-serif", head:"'Segoe UI', system-ui, Arial, sans-serif"},
  {id:'classica', label:'Clássica', body:"'Trebuchet MS', Verdana, sans-serif", head:"Georgia, 'Times New Roman', serif"},
  {id:'impacto', label:'Destaque (forte)', body:"'Arial', 'Helvetica', sans-serif", head:"'Arial Black', 'Arial', sans-serif"},
  {id:'retro', label:'Retrô (máquina de escrever)', body:"'Courier New', Courier, monospace", head:"'Courier New', Courier, monospace"}
];
let PANEL_THEME = Object.assign({}, THEME_DEFAULT);
function hexRgb(h){ h=String(h||'').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); if(isNaN(n)) return {r:0,g:0,b:0}; return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
function mixColor(a,b,w){ const ca=hexRgb(a), cb=hexRgb(b); const c={r:Math.round(ca.r*(1-w)+cb.r*w),g:Math.round(ca.g*(1-w)+cb.g*w),b:Math.round(ca.b*(1-w)+cb.b*w)}; return '#'+((1<<24)+(c.r<<16)+(c.g<<8)+c.b).toString(16).slice(1); }
function lumOf(h){ const c=hexRgb(h); return (0.299*c.r+0.587*c.g+0.114*c.b)/255; }
function alphaOf(h,a){ const c=hexRgb(h); return 'rgba('+c.r+','+c.g+','+c.b+','+a+')'; }
function cleanPanelTheme(th){
  const t = th && typeof th === 'object' ? th : {};
  const hex = v => /^#[0-9a-fA-F]{6}$/.test(String(v||'')) ? String(v) : null;
  return { primary: hex(t.primary) || THEME_DEFAULT.primary, bg: hex(t.bg) || THEME_DEFAULT.bg, font: THEME_FONT_OPTS.some(f=>f.id===t.font) ? t.font : 'padrao' };
}
function applyPanelTheme(th){
  PANEL_THEME = cleanPanelTheme(th);
  try{ localStorage.setItem('ba_admin_theme', JSON.stringify(PANEL_THEME)); }catch(e){}
  const primary = PANEL_THEME.primary, bg = PANEL_THEME.bg;
  const dark = lumOf(bg) < 0.45;
  const card = dark ? mixColor(bg,'#ffffff',0.10) : '#ffffff';
  const text = dark ? '#F5EFE8' : '#35272C';
  const muted = dark ? '#B9AFA6' : '#8F7D84';
  const line = dark ? alphaOf('#ffffff',0.16) : mixColor(bg, text, 0.86);
  const soft = mixColor(primary, card, dark ? 0.32 : 0.12);
  const faint = mixColor(primary, card, dark ? 0.14 : 0.04);
  const primDark = dark ? mixColor(primary, '#ffffff', lumOf(primary) < 0.55 ? 0.42 : 0.18) : mixColor(primary, '#000000', 0.22);
  const grad = dark ? mixColor(primary, '#ffffff', 0.18) : mixColor(primary, '#ffffff', 0.22);
  const contrast = lumOf(primary) > 0.62 ? '#1A1410' : '#FFFFFF';
  const F = THEME_FONT_OPTS.find(f=>f.id===PANEL_THEME.font) || THEME_FONT_OPTS[0];
  const tone = (hex) => dark ? mixColor(hex, '#ffffff', 0.42) : hex;
  const softOf = (hex) => dark ? mixColor(hex, card, 0.80) : mixColor(hex, '#ffffff', 0.86);
  const extras = dark ? ('--green:'+tone('#2FA36B')+';--red:'+tone('#D64545')+';--amber:'+tone('#C99B3F')+';--blue:'+tone('#3E6FB0')+';'
    + '--green-soft:'+softOf('#2FA36B')+';--red-soft:'+softOf('#D64545')+';--amber-soft:'+softOf('#C99B3F')+';--blue-soft:'+softOf('#3E6FB0')+';') : '';
  const css = ':root{color-scheme:'+(dark?'dark':'light')+';'+extras+'--pink:'+primary+';--pink-dark:'+primDark+';--pink-soft:'+soft+';--pink-faint:'+faint+';--pink-grad:'+grad+';--pink-contrast:'+contrast+';--bg:'+bg+';--card:'+card+';--dark:'+text+';--muted:'+muted+';--line:'+line+';--font-body:'+F.body+';--font-heading:'+F.head+'}';
  let tag = document.getElementById('adminThemeVars');
  if(!tag){ tag = document.createElement('style'); tag.id = 'adminThemeVars'; document.head.appendChild(tag); }
  tag.textContent = css;
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', primary);
}
function loadCachedTheme(){
  try{
    const raw = localStorage.getItem('ba_admin_theme');
    if(raw) applyPanelTheme(JSON.parse(raw));
  }catch(e){}
}

  const pset = THEME_PRESETS.find(x=>x.id===id);

function refreshBrandLogos(v){
  const src = '/icons/icon-192.png?v=' + (v || Date.now());
  document.querySelectorAll('img[src*="/icons/icon-192.png"]').forEach(img => { img.src = src; });
  const prev = document.getElementById('brandLogoPrev');
  if(prev) prev.innerHTML = '<img src="'+src+'" alt="logo" style="width:100%;height:100%;object-fit:cover">';
}
function pickBrandLogo(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  ev.target.value = '';
  if(!String(f.type||'').startsWith('image/')){ toast('Envie uma imagem'); return; }
  const reader = new FileReader();
  reader.onerror = () => toast('Erro ao ler imagem');
  reader.onload = e => {
    const img = new Image();
    img.onerror = () => toast('Imagem inválida');
    img.onload = () => {
      try{
        const scale = Math.min(1, 800 / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = cv.toDataURL('image/png');
        api('/api/admin/logo', {method:'PUT', body:JSON.stringify({logo:dataUrl})}).then(d => {
          refreshBrandLogos(d.logoV);
          toast('📷 Logo do BoraAgendar atualizada!');
        }).catch(err => toast(err.message));
      }catch(err){ toast('Não foi possível processar a imagem'); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
}
async function removeBrandLogo(){
  try{
    const d = await api('/api/admin/logo', {method:'PUT', body:JSON.stringify({logo:null})});
    refreshBrandLogos(d.logoV);

}

async function api(path, opts){
  opts = opts||{};
  const headers = {'Content-Type':'application/json'};
  if(TOKEN) headers['Authorization']='Bearer '+TOKEN;
  const r = await fetch(path, Object.assign({},opts,{headers}));
  let j = {}; try{ j = await r.json(); }catch(e){}
  if(!r.ok || j.ok===false) throw new Error(j.error||'Erro no servidor');
  return j;
}
function fmtWhen(ts){
  if(!ts) return '—';
  const mins = Math.round((Date.now()-ts)/60000);
  if(mins<1) return 'agora';
  if(mins<60) return 'há '+mins+' min';
  const h = Math.round(mins/60);
  if(h<24) return 'há '+h+' h';
  return 'há '+Math.round(h/24)+' d';
}
async function doLogin(){
  const email = ($('#lgEmail').value||'').trim(), pass = $('#lgPass').value||'';
  try{
    const d = await api('/api/auth/login', {method:'POST', body:JSON.stringify({email, password:pass})});
    if(d.role!=='admin'){ toast('Esse acesso é de salão'); return; }
    TOKEN = d.token;
    localStorage.setItem('ba_admin', TOKEN); localStorage.removeItem('glowp_admin');
    enterApp();
  }catch(e){ toast(e.message); }
}
function logout(){ TOKEN=null; localStorage.removeItem('ba_admin'); localStorage.removeItem('glowp_admin'); $('#appScreen').style.display='none'; $('#loginScreen').style.display='flex'; }

  [dash, salons, tickets] = await Promise.all([

    api('/api/admin/tickets')

  try{ finData = await api('/api/admin/finance-month' + (finMonth ? ('?month='+encodeURIComponent(finMonth)) : '')); }catch(e){ finData = finData || { month:'', collected:0, spent:0, profit:0, expenses:[] }; }
  salons = salons.salons; tickets = tickets.tickets;
  if (dash && dash.theme) applyPanelTheme(dash.theme);
  if (dash && dash.planPrices) {
    PLAN_PRICES = {
      'Básico': dash.planPrices.basico || 69,
      'Pro': dash.planPrices.pro || 139,
      'Premium': dash.planPrices.premium || 249
    };

  applyAdminProfile();
}

async function renderPage(){

    if(page==='dash') renderDash();
    else if(page==='saloes') renderSaloes();
    else if(page==='financeiro') renderFinanceiro();
    else if(page==='vendas') renderVendas();
    else if(page==='suporte') renderSuporte();

    if(String(e.message).includes('401')||String(e.message).includes('não autorizado')){ logout(); return; }

function salonCatOf(s){
  if (s.status === 'suspenso') return 'bloqueado';
  if (s.status === 'teste') return 'teste';
  const today = new Date().toISOString().slice(0,10);
  if (s.nextDue && s.nextDue < today) return 'vencido';
  return 'ativo';
}
function salonCatMeta(id){
  return {
    teste: { label:'Teste grátis', hint:'ainda no período de teste' },
    ativo: { label:'Ativo', hint:'assinatura em dia' },
    vencido: { label:'Vencido', hint:'pagamento atrasado — ainda no ar' },
    bloqueado: { label:'Bloqueado', hint:'agendamento público pausado' }
  }[id] || { label:id, hint:'' };
}
function setSalonCat(id){ salonCat = id; renderSaloes(); }
function renderSaloes(){
  const q = searchQ.toLowerCase();
  const all = salons.filter(s => !q || s.name.toLowerCase().includes(q) || s.owner.toLowerCase().includes(q) || String(s.email||'').toLowerCase().includes(q));
  const order = ['teste','ativo','vencido','bloqueado'];
  const groups = {};
  order.forEach(k => groups[k] = []);
  all.forEach(s => {
    const k = salonCatOf(s);
    (groups[k] || (groups[k] = [])).push(s);
  });
  const pills = [{id:'todos', label:'Todos', n: all.length}].concat(order.map(id => ({id, label: salonCatMeta(id).label, n: groups[id].length})));
  const pillHtml = `<div class="cat-pills">${pills.map(p => `<button type="button" class="${salonCat===p.id?'on':''}" onclick="setSalonCat('${p.id}')">${esc(p.label)}<span class="n">${p.n}</span></button>`).join('')}</div>`;
  const show = salonCat === 'todos' ? order : [salonCat];
  let body = '';
  show.forEach(id => {
    const list = groups[id] || [];
    const meta = salonCatMeta(id);
    body += `<div class="cat-head"><span class="badge ${id}">${esc(meta.label).toUpperCase()}</span><h3>${esc(meta.label)}</h3><span class="sub">${list.length} · ${esc(meta.hint)}</span></div>`;
    body += list.length
      ? `<div class="salon-grid">${list.map(salonCard).join('')}</div>`
      : `<p style="color:var(--muted);font-size:13px;margin:0 0 8px">Nenhum salão nesta categoria.</p>`;
  });
  $('#content').innerHTML = `
    <div class="toolbar">
      <input class="search" placeholder="🔎 Buscar salão, dono ou e-mail..." value="${esc(searchQ)}" oninput="searchQ=this.value;renderSaloes()">
      <button class="btn ghost" onclick="enviarTutorialTodos()">📘 Tutorial para os donos</button>
      <button class="btn ghost" onclick="mensagemDonos()">💬 Mensagem para os donos</button>
      <button class="btn" onclick="novoSalon()">＋ Novo salão</button>
    </div>
    <div class="section-title"><h2>Salões na plataforma</h2><span class="sub">${all.length} no total</span></div>
    ${pillHtml}
    ${body}`;
}

async function saveGift(slug){
  const unit = $('#giftUnit').value, q = parseInt($('#giftQty').value, 10);
  const days = unit === 'm' ? q*30 : q;
  if(!days || days < 1 || days > 730){ toast('Entre 1 e 730 dias (ou até 24 meses)'); return; }
  try{
    const d = await api('/api/admin/salons/'+slug+'/gift', {method:'POST', body:JSON.stringify({days, note:($('#giftNote').value||'').trim(), notify:!!$('#giftNotify').checked})});
    closeModal(); toast('🎁 Cortesia liberada! +'+d.days+' dias — acesso até '+fmtDateBR(d.until)+(d.notified?' · aviso sendo enviado':''));
    await refreshData(); if(page==='saloes') renderSaloes();
  }catch(e){ toast(e.message); }
}

function salonDueAmount(s){
  const base = PLAN_PRICES[s && s.plan] || 0;
  if(s && s.discountTimesLeft>0 && s.discountPercent>0) return Math.max(0, base - Math.round(base * s.discountPercent / 100));
  return base;
}

async function restoreBackupFile(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  if(file.size > 4800000){ toast('O backup é maior que o limite permitido'); return; }
  if(!confirm('Restaurar este backup agora? Os dados atuais serão substituídos.')) return;
  try{
    const snapshot = JSON.parse(await file.text());
    if(!snapshot.db || !snapshot.salons) throw new Error('Este arquivo não parece ser um backup do BoraAgendar');
    const d = await api('/api/admin/restore', {method:'POST', body:JSON.stringify(snapshot)});
    closeModal();
    toast(`✅ ${d.restoredSalons} salão(ões) restaurado(s). Entre novamente.`);
    TOKEN=null; localStorage.removeItem('ba_admin'); localStorage.removeItem('glowp_admin');
    setTimeout(()=>location.reload(), 900);
  }catch(e){ toast('Falha ao restaurar: '+e.message); }
}

async function downloadBackup(){
  try{
    const r = await fetch('/api/admin/backup', {headers:{'Authorization':'Bearer '+TOKEN}});
    const blob = await r.blob();
    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url;
    a.download = 'boraagendar-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('⬇️ Backup baixado — guarde em local seguro!');
  }catch(e){ toast('Erro ao gerar backup: '+e.message); }
}

function toggleWhatsProvider(){
  const provider = $('#waProvider') ? $('#waProvider').value : 'zapi';
  const zapster = $('#zapsterFields'), zapi = $('#zapiFields'), meta = $('#metaFields');
  if(zapster) zapster.style.display = (provider === 'zapster' || provider === 'meta') ? 'block' : 'none';
  if(zapi) zapi.style.display = provider === 'zapi' ? 'block' : 'none';
  if(meta) meta.style.display = provider === 'meta' ? 'block' : 'none';
}
async function metaSubscribe(){
  const out = $('#mmOut'); if(out) out.textContent = 'Vinculando a conta WhatsApp ao aplicativo Meta…';
  try{
    const d = await api('/api/admin/meta-subscribe', {method:'POST', body:'{}'});
    if(out) out.textContent = d.ok ? '✅ Conta Meta vinculada. Agora as mensagens reais podem chegar ao BoraAgendar.' : ('❌ ' + (d.result||'falhou'));
    toast(d.ok ? '🔗 Conta Meta vinculada' : 'Falhou ao vincular conta Meta');
  }catch(e){ if(out) out.textContent = 'Erro: ' + (e.message||e); }
}
async function metaTemplates(){
  const out = $('#mmOut'); if(out) out.textContent = 'Enviando templates para aprovação da Meta…';
  try{
    const d = await api('/api/admin/meta-templates', {method:'POST', body:'{}'});
    const lines = (d.results||[]).map(r => '• ' + r.name + ': ' + (r.status||'') + (r.existed?' (já existia)':''));
    if(out) out.textContent = lines.join('\n') || 'Nada a fazer.';
    toast('📮 Templates enviados — a Meta costuma aprovar em minutos ou horas');
  }catch(e){ if(out) out.textContent = 'Erro: ' + (e.message||e); }
}
async function metaCheck(){
  const out = $('#mmOut'); if(out) out.textContent = 'Checando conexão…';
  try{
    const d = await api('/api/admin/meta-check', {method:'POST', body:'{}'});
    if(out) out.textContent = d.ok ? ('✅ Conectado! Número: ' + (d.number||'—') + ' · qualidade: ' + (d.quality||'—')) : ('❌ ' + (d.error||'não respondeu'));
  }catch(e){ if(out) out.textContent = 'Erro: ' + (e.message||e); }
}
async function saveGateway(){
  const mercadopagoToken = ($('#gwToken').value||'').trim();
  const pixKey = ($('#gwPix').value||'').trim();
  const trialDays = parseInt($('#gwTrial').value,10)||15;
  const whatsappProvider = $('#waProvider').value;
  const zapi = { baseUrl: ($('#zaUrl').value||'').trim(), instance: ($('#zaInst').value||'').trim(), token: ($('#zaTok').value||'').trim() };
  const zapster = { baseUrl: ($('#zsUrl').value||'https://api.zapsterapi.com').trim(), instance: ($('#zsInst').value||'').trim(), token: ($('#zsTok').value||'').trim() };
  const meta = { phoneId: ($('#mmPhone') && $('#mmPhone').value || '').trim(), token: ($('#mmTok') && $('#mmTok').value || '').trim(), wabaId: ($('#mmWaba') && $('#mmWaba').value || '').trim(), verifyToken: ($('#mmVerify') && $('#mmVerify').value || '').trim(), appSecret: ($('#mmSecret') && $('#mmSecret').value || '').trim() };
  const ai = { baseUrl: ($('#aiBase') && $('#aiBase').value || '').trim(), model: ($('#aiModel') && $('#aiModel').value || '').trim(), token: ($('#aiKey') && $('#aiKey').value || '').trim() };
  const planPrices = { basico: parseInt($('#gpBasic') && $('#gpBasic').value,10)||69, pro: parseInt($('#gpPro') && $('#gpPro').value,10)||139, premium: parseInt($('#gpPremium') && $('#gpPremium').value,10)||249 };
  const automations = { autoBilling: !!($('#auBilling') && $('#auBilling').checked), weeklyReport: false, whatsMonitor: !!($('#auMonitor') && $('#auMonitor').checked), autoBackup: !!($('#auBackup') && $('#auBackup').checked), leadSales: !!($('#auSales') && $('#auSales').checked), autoSuspend: !!($('#auSuspend') && $('#auSuspend').checked), divulgaTips: !!($('#auTips') && $('#auTips').checked) };
  const adminWhats = ($('#adAdminWhats') && $('#adAdminWhats').value || '').trim();
  const referral = { enabled: !!($('#rfEnabled') && $('#rfEnabled').checked), percent: parseInt($('#rfPct') && $('#rfPct').value, 10) || 20 };
  const clientReferral = { enabled: !!($('#crfEnabled') && $('#crfEnabled').checked), percent: parseInt($('#crfPct') && $('#crfPct').value, 10) || 15, welcomePercent: parseInt($('#crfWelcome') && $('#crfWelcome').value, 10) || 0, expiryDays: parseInt($('#crfExpiry') && $('#crfExpiry').value, 10) || 0, maxCredits: parseInt($('#crfMax') && $('#crfMax').value, 10) || 0 };
  try{
    const botConcierge = !!($('#botConcierge') && $('#botConcierge').checked);
    await api('/api/admin/gateway', {method:'PUT', body:JSON.stringify({mercadopagoToken, pixKey, trialDays, whatsappProvider, zapi, zapster, meta, ai, planPrices, automations, adminWhats, referral, clientReferral, botConcierge})});
    toast('💾 Configurações salvas');
    PLAN_PRICES = {'Básico':planPrices.basico,'Pro':planPrices.pro,'Premium':planPrices.premium};
    renderConfig();
  }catch(e){ toast(e.message); }
}
async function testarConcierge(){
  const telefone = prompt('Telefone da cliente (só para simular, nada é enviado):','5521999990001');
  if(telefone===null) return;
  const msg = prompt('O que a cliente escreveu?','oi');
  if(msg===null) return;
  const reset = confirm('OK = esquecer a escolha anterior desta cliente (testar do zero).');
  try{
    const d = await api('/api/bot/test', {method:'POST', body:JSON.stringify({platform:true, reset:!!reset, from:String(telefone).replace(/\D/g,''), message:msg})});
    modal(`<h3>🧪 Resposta do bot</h3>
      <p style="font-size:12.5px;color:var(--muted)">Canal: <b>${esc(d.channel||'—')}</b> · Papel: <b>${esc(d.role||'—')}</b> · Espaço: <b>${esc(d.salon||(d.channel==='platform'?'plataforma':'—'))}</b>${d.ignored?(' · ignorado: '+esc(d.ignored)):''}</p>
      ${d.reply?'<div class="note" style="white-space:pre-wrap;margin-top:10px">'+esc(d.reply)+'</div>':'<div class="note" style="margin-top:10px">O bot <b>ficou quieto</b> nesta mensagem ('+esc(d.ignored||'sem resposta')+'). É o esperado para conversa fiada, sticker ou áudio sem legenda.</div>'}
      <div class="m-actions"><button class="btn" onclick="closeModal()">Fechar</button></div>`);
  }catch(e){ toast(e.message); }
}
async function runRemindersNow(){
  try{
    const d = await api('/api/admin/run-reminders', {method:'POST', body:JSON.stringify({})});
    toast(`⚡ Lembretes: ${d.sent} enviados · ${d.pending} pendentes de envio manual`);
  }catch(e){ toast(e.message); }
}
async function registerSalonWebhooks(){
  try{
    const d = await api('/api/admin/whats-webhooks', {method:'POST', body:JSON.stringify({})});
    const ok = (d.results||[]).filter(x=>x.ok).length;
    const miss = (d.results||[]).filter(x=>!x.ok);
    toast('🔗 Webhook: '+ok+' ligado(s)' + (miss.length ? ' · sem instância: '+miss.map(x=>x.target).join(', ') : ''));
  }catch(e){ toast(e.message); }
}
function togglePass(inputId, btn){
  const el = document.getElementById(inputId);
  if(!el) return;
  if(el.type === 'password'){ el.type = 'text'; if(btn) btn.textContent = '🙈'; }
  else { el.type = 'password'; if(btn) btn.textContent = '👁️'; }
}
function modal(html){ $('#modalBox').innerHTML = html; $('#overlay').classList.add('show'); }
function closeModal(){ $('#overlay').classList.remove('show'); }
$('#overlay').addEventListener('click', e=>{ if(e.target===$('#overlay')) closeModal(); });
